name: Actualizar cache del dashboard

# Drive es la fuente de verdad; esta copia se renueva cada 5 minutos.

on:
  push:
    paths:
      - ".github/workflows/cache-dashboard-data.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsj-dashboard-data-cache
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout rama de cache
        uses: actions/checkout@v4
        with:
          ref: data-cache
          fetch-depth: 0

      - name: Consultar fuentes y conservar ultimo dato valido
        shell: bash
        env:
          API_URL: https://script.google.com/macros/s/AKfycbxzu1Mob_Z7E0-33nMXmFDk1zsaOWnUyzb1s58z1NH_2qDK4utHfvtO9-N31GtMuYwyEA/exec
        run: |
          set -u
          mkdir -p data .tmp-cache

          fetch_section() {
            section="$1"
            tmp=".tmp-cache/$section.json"
            url="$API_URL?section=$section&_=$(date +%s)"

            echo "Actualizando $section..."

            if curl               --location               --fail               --silent               --show-error               --connect-timeout 20               --max-time 180               --retry 1               --retry-delay 2               "$url"               --output "$tmp"; then

              if jq -e --arg section "$section"                 '.ok == true and .[$section] != null'                 "$tmp" >/dev/null; then
                mv "$tmp" "data/$section.json"
                echo "$section OK"
                return 0
              fi
            fi

            echo "$section no respondio correctamente; se conserva la ultima copia valida."
            rm -f "$tmp"
            return 0
          }

          fetch_section planServ &
          p1=$!
          fetch_section salidas &
          p2=$!
          fetch_section guardia &
          p3=$!
          fetch_section os &
          p4=$!
          fetch_section kpi &
          p5=$!

          wait "$p1" "$p2" "$p3" "$p4" "$p5"

          # Conservar una copia mensual de Planillería para los reportes históricos.
          # Durante el mes se actualiza el mismo archivo; al cambiar de mes queda
          # archivado y el nuevo mes comienza a escribirse en otro JSON.
          if jq -e '.salidas.unitRows != null and .period.year != null and .period.month != null' data/salidas.json >/dev/null 2>&1; then
            year="$(jq -r '.period.year' data/salidas.json)"
            month="$(jq -r '.period.month' data/salidas.json)"
            archive="$(printf 'data/units-report-%04d-%02d.json' "$year" "$month")"

            jq '{
              year: (.period.year | tonumber),
              month: (.period.month | tonumber),
              day: (.period.day | tonumber),
              source: (.sources.salidas // .salidas.source // {}),
              unitRows: (.salidas.unitRows // [])
            }' data/salidas.json > "$archive"

            echo "Histórico de reemplazos actualizado: $archive"
          fi

          rm -rf .tmp-cache

      - name: Publicar cache si cambio
        shell: bash
        run: |
          git config user.name "TSJ Dashboard Cache"
          git config user.email "actions@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "cache: actualizar datos operativos"
          git push origin data-cache
