<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSJ | Rutina de regularidad y frecuencia</title>
<meta name="description" content="Rutina de regularidad y frecuencia - Transporte San José S.A.">

<style>
:root{
  --ink:#181416;
  --muted:#746d72;
  --pink:#ed2e91;
  --pink-dark:#be176d;
  --pink-pale:#fff0f8;
  --line:#e9e4e7;
  --paper:#fff;
  --bg:#f6f4f5;
  --good:#11815d;
  --warn:#d77817;
  --bad:#c43351;
  --shadow:0 10px 30px rgba(44,30,39,.07)
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  font-size:15px
}

button,input{font:inherit}

.shell{
  max-width:1500px;
  margin:auto;
  padding:24px 28px 48px
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px
}

.brand{
  display:flex;
  align-items:center;
  gap:16px
}

.brand-logo{
  width:118px;
  height:auto
}

.brand-name{
  font-size:14px;
  letter-spacing:.1em;
  font-weight:850
}

.status-wrap{
  display:flex;
  align-items:center;
  gap:12px
}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--warn);
  box-shadow:0 0 0 4px rgba(215,120,23,.12)
}

.dot.ok{
  background:var(--good);
  box-shadow:0 0 0 4px rgba(17,129,93,.12)
}

.refresh{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:9px 12px;
  font-weight:750;
  cursor:pointer
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:18px
}

.hero h1{
  font-size:32px;
  line-height:1.04;
  letter-spacing:-1.2px;
  margin:0
}

.date-control{
  display:flex;
  align-items:center;
  background:var(--ink);
  border-radius:12px;
  padding:7px 10px
}

.date-control input{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-weight:800;
  font-size:13px;
  min-width:145px;
  color-scheme:dark;
  cursor:pointer
}

.date-control input::-webkit-calendar-picker-indicator{
  filter:invert(1);
  cursor:pointer
}

.date-control.hidden{display:none}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  padding:5px;
  background:#ece8ea;
  border-radius:14px;
  margin-bottom:22px
}

.tab{
  border:0;
  background:transparent;
  color:#5f585d;
  font-weight:800;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap
}

.tab.active{
  background:#fff;
  color:var(--ink);
  box-shadow:0 3px 10px rgba(0,0,0,.06)
}

.tab-panel{display:none}
.tab-panel.active{display:block}

.section-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:end;
  margin:6px 0 14px
}

.section-head h2{
  font-size:22px;
  margin:0
}

.source{
  font-size:12px;
  color:var(--muted);
  text-align:right
}

.kpis{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin-bottom:16px
}

.kpi,
.panel,
.mini,
.gauge-card,
.kpi-ref-card,
.kpi-month-panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow)
}

.kpi{
  padding:17px;
  min-height:116px
}

.kpi .label,
.mini .t{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.05em
}

.kpi .value{
  font-size:31px;
  font-weight:900;
  margin-top:8px
}

.kpi .sub{
  font-size:12px;
  color:var(--muted);
  margin-top:5px
}

.kpi.good .value,
.mini.good .n{color:var(--good)}

.kpi.warn .value{color:var(--warn)}

.kpi.bad .value,
.mini.bad .n{color:var(--bad)}

.grid2{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:14px;
  margin-bottom:14px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.panel{
  padding:18px;
  margin-bottom:14px;
  overflow:hidden
}

.panel h3{
  font-size:15px;
  margin:0 0 15px
}

.bars{
  display:flex;
  flex-direction:column;
  gap:11px
}

.bar-row{
  display:grid;
  grid-template-columns:minmax(120px,1fr) 2.2fr 34px;
  align-items:center;
  gap:9px
}

.bar-label{
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.track{
  height:9px;
  background:#f0ecee;
  border-radius:999px;
  overflow:hidden
}

.fill{
  height:100%;
  background:var(--pink);
  border-radius:999px
}

.bar-value{
  text-align:right;
  font-size:12px;
  font-weight:800
}

.table-wrap{
  overflow:visible;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed
}

th,td{
  padding:9px 8px;
  border-bottom:1px solid #eee9ec;
  text-align:left;
  font-size:11px;
  vertical-align:top;
  white-space:normal;
  overflow-wrap:anywhere;
  line-height:1.3
}

th{
  background:#faf8f9;
  color:#645d62;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.04em
}

tbody tr:last-child td{border-bottom:0}

.pill{
  display:inline-flex;
  border-radius:999px;
  padding:4px 8px;
  background:var(--pink-pale);
  color:var(--pink-dark);
  font-size:10px;
  font-weight:800
}

.note-list{
  display:flex;
  flex-direction:column;
  gap:9px
}

.note{
  border-left:3px solid var(--pink);
  background:#fff8fc;
  border-radius:0 10px 10px 0;
  padding:10px 12px;
  font-size:12px;
  line-height:1.45
}

.note .date{
  color:var(--muted);
  font-weight:750;
  margin-right:5px
}

.plan-hero{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:16px;
  margin-bottom:14px
}

.gauge-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:22px
}

.gauge{
  --p:0;
  --gauge-color:var(--pink);
  position:relative;
  width:154px;
  height:154px;
  border-radius:50%;
  background:conic-gradient(
    var(--gauge-color) calc(var(--p)*1%),
    #eee8eb 0
  );
  display:grid;
  place-items:center
}

.gauge:after{
  content:"";
  position:absolute;
  width:116px;
  height:116px;
  border-radius:50%;
  background:#fff
}

.gauge-content{
  position:relative;
  z-index:1;
  text-align:center
}

.gauge-content b{font-size:29px}

.gauge-content span{
  display:block;
  color:var(--muted);
  font-size:11px
}

.gauge-label{
  margin-top:12px;
  font-weight:850
}

.plan-main{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.mini{padding:17px}

.mini .n{
  font-size:26px;
  font-weight:900;
  margin-top:6px
}

.mini.good{
  border-color:#cfe8df;
  background:#f6fbf9
}

.mini.bad{
  border-color:#f0ccd5;
  background:#fff6f8
}

.plan-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.hero-stat{
  background:var(--ink);
  color:#fff;
  border-radius:16px;
  padding:20px
}

.hero-stat .over{
  font-size:11px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#c8c3c6;
  font-weight:800
}

.hero-stat .big{
  font-size:32px;
  font-weight:900;
  margin-top:7px
}

.hero-stat .small{
  color:#d7d2d5;
  margin-top:3px;
  font-size:13px
}

.service-note{
  margin:-2px 0 14px;
  border-left:4px solid var(--good);
  background:#eef8f4;
  color:#17684f;
  border-radius:0 12px 12px 0;
  padding:11px 14px;
  font-size:13px;
  font-weight:750
}

.kpi-alert{
  border-left:4px solid var(--warn);
  background:#fffaf2;
  padding:12px 16px;
  border-radius:0 12px 12px 0;
  font-size:13px;
  margin-bottom:16px
}

.kpi-dashboard{
  display:grid;
  grid-template-columns:minmax(0,1.8fr) minmax(360px,1fr);
  gap:18px;
  align-items:start
}

.kpi-card-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px
}

.kpi-ref-card{
  padding:17px 18px;
  min-height:155px;
  display:flex;
  flex-direction:column
}

.metric-label{
  font-size:12px;
  font-weight:800;
  color:#655e63;
  min-height:32px
}

.metric-value{
  font-size:31px;
  font-weight:900;
  margin:7px 0 4px
}

.metric-sub{
  font-size:11px;
  font-weight:750;
  color:var(--muted);
  margin-top:auto
}

.metric-track{
  height:6px;
  background:#eee9ec;
  border-radius:999px;
  overflow:hidden;
  margin-top:13px
}

.metric-fill{
  height:100%;
  background:var(--good);
  border-radius:999px
}

.status-bad .metric-fill{background:var(--bad)}
.status-bad .metric-sub{color:var(--bad)}
.status-good .metric-sub{color:var(--good)}

.kpi-month-panel{padding:22px 24px}

.kpi-month-panel h3{
  font-size:18px;
  margin:0
}

.month-sub{
  font-size:12px;
  color:var(--muted);
  margin:5px 0 18px
}

.kpi-month-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto 86px;
  gap:12px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #ece7ea
}

.kpi-month-row:last-child{border-bottom:0}

.kpi-month-row .name{font-size:12px}

.kpi-month-row .meta{
  font-size:11px;
  color:#6c6268;
  font-weight:700;
  white-space:nowrap
}

.kpi-badge{
  justify-self:end;
  min-width:82px;
  text-align:center;
  border-radius:999px;
  padding:6px 10px;
  font-size:11px;
  font-weight:900;
  background:#e7f5f0;
  color:var(--good)
}

.kpi-badge.bad{
  background:#fde7ee;
  color:var(--bad)
}

.kpi-badge.neutral{
  background:#f0edef;
  color:#6d656a
}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #d7ced3;
  border-radius:12px
}

.foot{
  margin-top:24px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:var(--muted);
  font-size:11px
}

.error{
  display:none;
  background:#fff5f2;
  border:1px solid #f1cfc4;
  color:#8c3825;
  border-radius:12px;
  padding:11px 14px;
  margin-bottom:14px
}

.error.show{display:block}
.muted{color:var(--muted)}

@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .grid2,.plan-hero,.kpi-dashboard{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .plan-main{grid-template-columns:repeat(2,1fr)}
  .kpi-card-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:720px){
  .shell{padding:18px 14px 35px}
  .top,.hero,.section-head{
    align-items:flex-start;
    flex-direction:column
  }
  .status-wrap{
    width:100%;
    justify-content:space-between
  }
  .hero h1{font-size:27px}
  .kpis,.grid3,.plan-main,.plan-detail{
    grid-template-columns:1fr 1fr
  }
  .source{text-align:left}
  .kpi-card-grid{grid-template-columns:1fr 1fr}
}

@media(max-width:480px){
  .kpis,.grid3,.plan-main,.plan-detail,.kpi-card-grid{
    grid-template-columns:1fr
  }
  .brand-logo{width:92px}
  th,td{
    font-size:10px;
    padding:8px 6px
  }
  .kpi-month-row{grid-template-columns:1fr auto}
  .kpi-month-row .meta{grid-column:1}
  .kpi-badge{
    grid-column:2;
    grid-row:1 / span 2
  }
}
</style>
</head>

<body>

<div class="shell">

<header class="top">
  <div class="brand">
    <img class="brand-logo" src="logo-tsj.png" alt="Logo TSJ">
    <div class="brand-name">TRANSPORTE SAN JOSÉ S.A.</div>
  </div>

  <div class="status-wrap">
    <div class="live">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Actualizando…</span>
    </div>

    <button class="refresh" id="refreshBtn">
      Actualizar
    </button>
  </div>
</header>

<section class="hero">
  <h1>Rutina de regularidad y frecuencia</h1>

  <div class="date-control hidden">
    <input id="datePicker" type="date">
  </div>
</section>

<div id="errorBox" class="error"></div>

<nav class="tabs">
  <button class="tab active" data-tab="plan">Plan Serv</button>
  <button class="tab" data-tab="salidas">Planillería</button>
  <button class="tab" data-tab="guardia">Guardia</button>
  <button class="tab" data-tab="os">OS</button>
  <button class="tab" data-tab="kpi">KPI</button>
</nav>

<main>
  <section id="plan" class="tab-panel active"></section>
  <section id="salidas" class="tab-panel"></section>
  <section id="guardia" class="tab-panel"></section>
  <section id="os" class="tab-panel"></section>
  <section id="kpi" class="tab-panel"></section>
</main>

<footer class="foot">
  <span>Transporte San José S.A. · Uso interno</span>
  <span id="updatedAt">Última actualización: —</span>
</footer>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxzu1Mob_Z7E0-33nMXmFDk1zsaOWnUyzb1s58z1NH_2qDK4utHfvtO9-N31GtMuYwyEA/exec';

let DATA = {};
let ACTIVE_TAB = 'plan';

const DATE_BY_TAB = {
  salidas:'',
  guardia:'',
  kpi:''
};

const $ = s => document.querySelector(s);

const esc = v =>
  String(v ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

const num = v =>
  Number(v || 0).toLocaleString('es-AR');

const pad2 = v =>
  String(v).padStart(2,'0');

function sourceLabel(src){
  return src?.name
    ? `Fuente: ${esc(src.name)}`
    : 'Fuente no disponible';
}

function kpi(label,value,sub='',tone=''){
  return `
  <article class="kpi ${tone}">
    <div class="label">${esc(label)}</div>
    <div class="value">${esc(value)}</div>
    <div class="sub">${esc(sub)}</div>
  </article>`;
}

function mini(t,n,tone=''){
  return `
  <article class="mini ${tone}">
    <div class="t">${esc(t)}</div>
    <div class="n">${esc(n)}</div>
  </article>`;
}

function bars(items,limit=12){

  const a = (items || []).slice(0,limit);

  if(!a.length){
    return '<div class="empty">Sin datos para mostrar.</div>';
  }

  const max = Math.max(
    ...a.map(x => +x.value || 0),
    1
  );

  return `
  <div class="bars">

    ${a.map(x => `
      <div class="bar-row">

        <div class="bar-label"
             title="${esc(x.label)}">
          ${esc(x.label)}
        </div>

        <div class="track">
          <div class="fill"
               style="width:${Math.max(
                 3,
                 (+x.value || 0) / max * 100
               )}%">
          </div>
        </div>

        <div class="bar-value">
          ${num(x.value)}
        </div>

      </div>
    `).join('')}

  </div>`;
}

function table(headers,rows){

  if(!rows?.length){
    return '<div class="empty">Sin registros.</div>';
  }

  return `
  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          ${headers.map(
            h => `<th>${esc(h[0])}</th>`
          ).join('')}
        </tr>
      </thead>

      <tbody>

        ${rows.map(r => `
          <tr>

            ${headers.map(h => `
              <td>
                ${
                  h[2]
                  ? h[2](r[h[1]],r)
                  : esc(r[h[1]] ?? '')
                }
              </td>
            `).join('')}

          </tr>
        `).join('')}

      </tbody>

    </table>

  </div>`;
}

function todayISO(){

  const p = DATA.period || {};

  return p.year && p.month && p.day
    ? `${p.year}-${pad2(p.month)}-${pad2(p.day)}`
    : '';
}

function kpiDefaultISO(){

  const p = DATA.period || {};

  const days = (DATA.kpi?.daily || [])
    .map(x => {

      const m = String(x.date || '')
        .match(/^(\d{1,2})[\/-](\d{1,2})/);

      return (
        m &&
        +m[2] === +p.month
      )
        ? +m[1]
        : 0;
    })
    .filter(d =>
      d > 0 &&
      d < +p.day
    )
    .sort((a,b) => b-a);

  const d =
    days[0] ||
    Math.max(1,(+p.day || 1)-1);

  return p.year
    ? `${p.year}-${pad2(p.month)}-${pad2(d)}`
    : '';
}

function selectedISO(tab=ACTIVE_TAB){
  return DATE_BY_TAB[tab] || todayISO();
}

function selectedDDMM(tab=ACTIVE_TAB){

  const m = selectedISO(tab)
    .match(/^(\d{4})-(\d{2})-(\d{2})$/);

  return m
    ? `${m[3]}/${m[2]}`
    : '';
}

function selectedLabel(tab=ACTIVE_TAB){

  const v = selectedISO(tab);

  return v
    ? new Date(v+'T12:00:00')
        .toLocaleDateString(
          'es-AR',
          {
            day:'2-digit',
            month:'long',
            year:'numeric'
          }
        )
    : '';
}

function monthLabel(){

  const p = DATA.period || {};

  return p.month && p.year
    ? new Date(
        p.year,
        p.month-1,
        1
      ).toLocaleDateString(
        'es-AR',
        {
          month:'long',
          year:'numeric'
        }
      )
    : '';
}

function shortDateLabel(ddmm){

  const m = String(ddmm || '')
    .match(/^(\d{1,2})[\/-](\d{1,2})/);

  if(!m) return ddmm || '';

  const mon = [
    'ene','feb','mar','abr',
    'may','jun','jul','ago',
    'sep','oct','nov','dic'
  ][+m[2]-1];

  return `${+m[1]}-${mon}`;
}

function sameDay(v,key){

  const m = String(v || '')
    .match(/^(\d{1,2})[\/-](\d{1,2})/);

  return !!m &&
    `${pad2(+m[1])}/${pad2(+m[2])}` === key;
}

function countBy(rows,field){

  const o = {};

  (rows || []).forEach(r => {

    const k =
      String(r[field] || 'Sin dato').trim() ||
      'Sin dato';

    o[k] = (o[k] || 0) + 1;
  });

  return Object.entries(o)
    .map(([label,value]) => ({
      label,
      value
    }))
    .sort(
      (a,b) =>
        b.value-a.value ||
        a.label.localeCompare(b.label)
    );
}

function sortByLineAndService(rows){

  return [...(rows || [])]
    .sort(
      (a,b) =>
        String(a.linea || '')
          .localeCompare(
            String(b.linea || ''),
            'es',
            {numeric:true}
          )
        ||
        String(a.turno || a.servicio || '')
          .localeCompare(
            String(b.turno || b.servicio || ''),
            'es',
            {numeric:true}
          )
    );
}

function sortByLine(rows){

  return [...(rows || [])]
    .sort(
      (a,b) =>
        String(a.linea || '')
          .localeCompare(
            String(b.linea || ''),
            'es',
            {numeric:true}
          )
        ||
        String(a.interno || a.ubicacion || '')
          .localeCompare(
            String(b.interno || b.ubicacion || ''),
            'es',
            {numeric:true}
          )
    );
}

function fmtPct(v){

  if(
    v === null ||
    v === undefined ||
    v === ''
  ){
    return '-';
  }

  const s = String(v).trim();

  return s.includes('%')
    ? s
    : s + '%';
}

function fmtNumRaw(v){

  if(
    v === null ||
    v === undefined ||
    v === '' ||
    String(v).includes('#')
  ){
    return '-';
  }

  const n =
    Number(
      String(v).replace(',','.')
    );

  return Number.isFinite(n)
    ? n.toLocaleString(
        'es-AR',
        {maximumFractionDigits:2}
      )
    : String(v);
}

function rawNumber(v){

  if(
    v === null ||
    v === undefined ||
    v === '' ||
    String(v).includes('#')
  ){
    return null;
  }

  const n =
    parseFloat(
      String(v)
        .replace('%','')
        .replace(',','.')
        .replace(/[^0-9.\-]/g,'')
    );

  return Number.isFinite(n)
    ? n
    : null;
}

function metricPass(value,meta){

  const n = rawNumber(value);
  const t = rawNumber(meta);

  if(
    n === null ||
    t === null ||
    !meta
  ){
    return null;
  }

  const s = String(meta);

  if(
    s.includes('≤') ||
    s.includes('<=')
  ){
    return n <= t;
  }

  if(
    s.includes('≥') ||
    s.includes('>=')
  ){
    return n >= t;
  }

  return n >= t;
}

function metricProgress(value,meta){

  const n = rawNumber(value);

  if(n === null){
    return 0;
  }

  const t = rawNumber(meta);

  if(
    String(value).includes('%') ||
    String(meta).includes('%')
  ){
    return Math.max(
      0,
      Math.min(100,n)
    );
  }

  return t
    ? Math.max(
        0,
        Math.min(
          100,
          n/t*100
        )
      )
    : Math.max(
        0,
        Math.min(
          100,
          n*10
        )
      );
}

function kpiCard(metric,dateLabel){

  const pass =
    metric.meta
      ? metricPass(
          metric.raw,
          metric.meta
        )
      : null;

  const status =
    pass === true
      ? 'status-good'
      : pass === false
        ? 'status-bad'
        : '';

  const progress =
    metricProgress(
      metric.progressRaw !== undefined
        ? metric.progressRaw
        : metric.raw,
      metric.meta
    );

  return `
  <article class="kpi-ref-card ${status}">

    <div class="metric-label">
      ${esc(metric.label)}
    </div>

    <div class="metric-value">
      ${esc(metric.display)}
    </div>

    <div class="metric-sub">
      Dato del día · ${esc(dateLabel)}
    </div>

    <div class="metric-track">
      <div
        class="metric-fill"
        style="width:${progress}%"
      >
      </div>
    </div>

  </article>`;
}

function configureDatePicker(){

  const p = DATA.period || {};
  const el = $('#datePicker');

  if(
    !p.year ||
    !p.month
  ){
    return;
  }

  const mm = pad2(p.month);
  const today = todayISO();

  if(!DATE_BY_TAB.salidas){
    DATE_BY_TAB.salidas = today;
  }

  if(!DATE_BY_TAB.guardia){
    DATE_BY_TAB.guardia = today;
  }

  if(!DATE_BY_TAB.kpi){
    DATE_BY_TAB.kpi = kpiDefaultISO();
  }

  const hide =
    ACTIVE_TAB === 'plan' ||
    ACTIVE_TAB === 'os';

  el.parentElement
    .classList.toggle(
      'hidden',
      hide
    );

  if(hide){
    return;
  }

  el.min =
    `${p.year}-${mm}-01`;

  el.max =
    ACTIVE_TAB === 'kpi'
      ? kpiDefaultISO()
      : today;

  if(
    (DATE_BY_TAB[ACTIVE_TAB] || today)
    >
    el.max
  ){
    DATE_BY_TAB[ACTIVE_TAB] = el.max;
  }

  el.value =
    DATE_BY_TAB[ACTIVE_TAB];
}

========================= */

function setStatus(ok,text){

  $('#statusDot')
    .classList.toggle(
      'ok',
      ok
    );

  $('#statusText').textContent =
    text;
}


function loadLive(){

  setStatus(
    false,
    'Actualizando…'
  );

  const cb =
    'tsj_cb_' + Date.now();

  const s =
    document.createElement('script');


  window[cb] = payload => {

    try{

      DATA =
        payload || {};

      setStatus(
        !!payload?.ok,
        payload?.ok
          ? 'Datos en vivo'
          : 'Datos parciales'
      );

      renderAll();

    }
    finally{

      delete window[cb];
      s.remove();
    }
  };


  s.onerror = () => {

    setStatus(
      false,
      'Sin conexión'
    );

    $('#errorBox')
      .classList.add('show');

    $('#errorBox').textContent =
      'No se pudo conectar con la fuente de datos.';

    delete window[cb];
    s.remove();
  };


  s.src =
    API_URL +
    '?callback=' +
    cb +
    '&_=' +
    Date.now();

  document.body.appendChild(s);
}


/* =========================
   EVENTOS
========================= */

document
  .querySelectorAll('.tab')
  .forEach(btn => {

    btn.addEventListener(
      'click',
      () => {

        ACTIVE_TAB =
          btn.dataset.tab;

        document
          .querySelectorAll('.tab')
          .forEach(x =>
            x.classList.remove('active')
          );

        document
          .querySelectorAll('.tab-panel')
          .forEach(x =>
            x.classList.remove('active')
          );

        btn.classList.add('active');

        $('#' + ACTIVE_TAB)
          .classList.add('active');

        renderAll();
      }
    );

  });


$('#datePicker')
  .addEventListener(
    'change',
    e => {

      if(
        [
          'salidas',
          'guardia',
          'kpi'
        ].includes(ACTIVE_TAB)
      ){
        DATE_BY_TAB[ACTIVE_TAB] =
          e.target.value;
      }

      renderAll();
    }
  );


$('#refreshBtn')
  .addEventListener(
    'click',
    loadLive
  );


loadLive();

setInterval(
  loadLive,
  60000
);

</script>

</body>
</html>
