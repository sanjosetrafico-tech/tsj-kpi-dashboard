<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSJ | Rutina de regularidad y frecuencia</title>
<style>
:root{
--ink:#181416;
--muted:#746d72;
--pink:#ed2e91;
--pink-dark:#be176d;
--pink-pale:#fff0f8;
--line:#e9e4e7;
--paper:#ffffff;
--bg:#f6f4f5;
--good:#0b9b73;
--warn:#d77817;
--bad:#c43351;
--blue:#2f80d0;
--target:#ef1717;
--shadow:0 10px 30px rgba(44,30,39,.07);
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--bg);
color:var(--ink);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
font-size:15px;
}
button,input{font:inherit}
body.chart-modal-open{overflow:hidden}
.shell{max-width:1500px;margin:auto;padding:24px 28px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px}
.brand-logo{width:118px;height:auto}
.brand-name{font-size:14px;font-weight:850;letter-spacing:.1em}
.status-wrap{display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--good)}
.refresh,.export-btn{
border:1px solid var(--line);
background:#fff;
border-radius:11px;
padding:9px 13px;
font-weight:800;
cursor:pointer;
}
.export-btn{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}
.hero h1{font-size:32px;line-height:1.04;letter-spacing:-1.2px;margin:0}
.date-control{display:flex;background:var(--ink);border-radius:12px;padding:7px 10px}
.date-control input{border:0;outline:0;background:transparent;color:#fff;font-weight:800;color-scheme:dark}
.date-control.hidden{display:none}
.recorridos-open{display:none;align-items:center;justify-content:center;justify-self:end;background:var(--ink);color:#fff;text-decoration:none;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:850;white-space:nowrap}
body.recorridos-view .recorridos-open{display:inline-flex}
.recorridos-open:hover{background:#302930}
.recorridos-open:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
@media(max-width:720px){.recorridos-open{font-size:11px;padding:8px 10px}}
.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:5px;background:#ece8ea;border-radius:14px;margin-bottom:22px}
.tab{border:0;background:transparent;color:#5f585d;font-weight:800;padding:11px 17px;border-radius:10px;cursor:pointer}
.tab.active{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.recorridos-frame{display:block;width:100%;height:76dvh;min-height:520px;border:1px solid var(--line);border-radius:12px;background:#fff}
@media(max-width:700px){.recorridos-frame{height:80dvh;min-height:480px}}
body.profile-guardia .tab[data-tab="kpi"],
body.profile-guardia #kpi,
body.profile-guardia .tab[data-tab="graficos"],
body.profile-guardia #graficos{display:none!important}
body.profile-conduccion .tab:not([data-tab="conduccion"]),
body.profile-conduccion .tab-panel:not(#conduccion){display:none!important}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 14px}
.section-head h2{font-size:22px;margin:0}
.source{color:var(--muted);font-size:12px;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi,.panel,.mini,.gauge-card,.kpi-ref-card,.kpi-month-panel,.summary-kpi,.alert-card,.summary-alert-area,.impact-panel{
background:var(--paper);
border:1px solid var(--line);
border-radius:16px;
box-shadow:var(--shadow);
}
.kpi{padding:17px;min-height:116px}
.kpi .label,.mini .t{color:var(--muted);font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.05em}
.kpi .value{font-size:31px;font-weight:900;margin-top:8px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:5px}
.kpi.good .value,.mini.good .n{color:var(--good)}
.kpi.warn .value{color:var(--warn)}
.kpi.bad .value,.mini.bad .n{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.panel{padding:18px;margin-bottom:14px;overflow:hidden}
.panel h3{margin:0 0 15px;font-size:15px}
.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}
.count-badge.blue{background:#e9f2fc;color:#326aa5}
.count-badge.orange{background:#fff0df;color:#a15a16}
.count-badge.pink{background:#fff0f8;color:var(--pink-dark)}

/* PLANILLERIA */
.planillaria-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch;margin-bottom:14px}
.planillaria-left{display:grid;grid-template-rows:auto 1fr;gap:14px;min-width:0}
.planillaria-right{display:grid;grid-template-rows:repeat(2,1fr);gap:14px;min-width:0}
.planillaria-board .panel{margin-bottom:0;min-width:0}
.planillaria-right .panel{height:100%}
#salidas .kpis.has-six{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi.absence-alert{background:#fff4f7}
.kpi.absence-alert .value{color:var(--bad)}
.planillaria-right.has-absence{grid-template-rows:auto 1fr 1fr}
.planillaria-right.has-observations{grid-template-rows:1fr 1fr auto}
.planillaria-right.has-absence.has-observations{grid-template-rows:auto 1fr 1fr auto}
.absence-panel{border-top:5px solid var(--bad)}
.observation-panel{border-top:5px solid #746d72}
.plan-observations{display:flex;flex-direction:column;gap:8px}
.plan-observation-item{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#faf9fa;font-size:12px;line-height:1.4}

.report-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.report-card-head h3{margin:0}
.report-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:8px 13px;font-size:11px;font-weight:850;cursor:pointer}
.report-btn:hover{opacity:.88}

.units-report-root{display:none}
.units-report-sheet{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#181416;background:#fff}
.units-report-header{display:flex;align-items:center;justify-content:space-between;gap:6mm;padding-bottom:3mm;border-bottom:1px solid #ded8dc}
.units-report-brand{display:flex;align-items:center;gap:4mm}
.units-report-logo{width:28mm;height:auto}
.units-report-company{font-size:10pt;font-weight:850;letter-spacing:.08em}
.units-report-period{text-align:right;color:#655e63;font-size:8pt;line-height:1.35}
.units-report-title{margin:4mm 0 1mm;font-size:18pt;line-height:1.05}
.units-report-subtitle{margin:0 0 4mm;color:#6f676c;font-size:8pt}
.units-report-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:2.5mm;margin-bottom:4mm}
.units-report-kpi{min-height:23mm;padding:3.2mm;border:1px solid #e7e1e4;border-radius:3mm;background:#fff}
.units-report-kpi-label{color:#6b6268;font-size:6.7pt;font-weight:850;text-transform:uppercase;letter-spacing:.03em}
.units-report-kpi-value{margin-top:2mm;font-size:16pt;font-weight:950;line-height:1.05}
.units-report-kpi-sub{margin-top:1.5mm;color:#6f676c;font-size:6.5pt;line-height:1.25}
.units-report-summary-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:3mm}
.units-report-box{border:1px solid #e7e1e4;border-radius:3mm;padding:3.2mm;background:#fff}
.units-report-box h3{margin:0 0 2.5mm;font-size:9pt}
.units-report-bars{display:flex;flex-direction:column;gap:1.5mm}
.units-report-bar-row{display:grid;grid-template-columns:24mm 1fr 8mm;gap:2mm;align-items:center;font-size:6.6pt}
.units-report-bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.units-report-bar-track{height:2.5mm;background:#f0ecee;border-radius:99px;overflow:hidden}
.units-report-bar-fill{height:100%;background:#ed2e91;border-radius:99px}
.units-report-bar-value{text-align:right;font-weight:850}
.units-report-mini-table{width:100%;border-collapse:collapse;table-layout:fixed}.units-report-mini-table th,.units-report-mini-table td{padding:1.5mm 1.4mm;border-bottom:1px solid #eee9ec;font-size:6.6pt;line-height:1.2}
.units-report-mini-table th{background:#faf8f9;color:#645d62;font-size:6pt;text-transform:uppercase}
.units-report-detail-title{display:flex;justify-content:space-between;align-items:end;gap:4mm;margin:4mm 0 3mm}
.units-report-detail-title h2{margin:0;font-size:13pt}
.units-report-detail-title span{color:#6f676c;font-size:7pt}
.units-report-detail-columns{display:grid;grid-template-columns:1fr 1fr;gap:4mm;align-items:start}
.units-report-detail-table{width:100%;border-collapse:collapse;table-layout:fixed}
.units-report-detail-table th,.units-report-detail-table td{padding:1.45mm 1.2mm;border-bottom:1px solid #e8e2e5;font-size:6.3pt;line-height:1.15}
.units-report-detail-table th{background:#f6f3f5;color:#5f575c;font-size:5.8pt;font-weight:850;text-transform:uppercase}
.units-report-detail-table td:nth-child(1),.units-report-detail-table th:nth-child(1){width:13%}
.units-report-detail-table td:nth-child(2),.units-report-detail-table th:nth-child(2){width:10%}
.units-report-detail-table td:nth-child(3),.units-report-detail-table th:nth-child(3){width:10%}
.units-report-detail-table td:nth-child(4),.units-report-detail-table th:nth-child(4){width:20%}
.units-report-detail-table td:nth-child(5),.units-report-detail-table th:nth-child(5){width:20%}
.units-report-detail-table td:nth-child(6),.units-report-detail-table th:nth-child(6){width:27%}
.units-report-change{font-weight:900}
.units-report-motive{display:inline-block;padding:.8mm 1.6mm;border-radius:99px;background:#fff0f8;color:#be176d;font-weight:850}
.units-report-note{margin-top:3mm;color:#6f676c;font-size:6.5pt;line-height:1.35}

/* REPORTE MENSUAL OS */
.os-report-root{display:none}
.os-report-sheet{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#181416;background:#fff}
.os-report-header{display:flex;align-items:center;justify-content:space-between;gap:6mm;padding-bottom:3mm;border-bottom:1px solid #ded8dc}
.os-report-brand{display:flex;align-items:center;gap:4mm}
.os-report-logo{width:28mm;height:auto}
.os-report-company{font-size:10pt;font-weight:850;letter-spacing:.08em}
.os-report-period{text-align:right;color:#655e63;font-size:8pt;line-height:1.35}
.os-report-title{margin:4mm 0 1mm;font-size:18pt;line-height:1.05}
.os-report-subtitle{margin:0 0 4mm;color:#6f676c;font-size:8pt}
.os-report-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:2.5mm;margin-bottom:4mm}
.os-report-kpi{min-height:23mm;padding:3.2mm;border:1px solid #e7e1e4;border-radius:3mm;background:#fff}
.os-report-kpi-label{color:#6b6268;font-size:6.7pt;font-weight:850;text-transform:uppercase;letter-spacing:.03em}
.os-report-kpi-value{margin-top:2mm;font-size:16pt;font-weight:950;line-height:1.05}
.os-report-kpi-sub{margin-top:1.5mm;color:#6f676c;font-size:6.5pt;line-height:1.25}
.os-report-summary-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:3mm}
.os-report-box{border:1px solid #e7e1e4;border-radius:3mm;padding:3.2mm;background:#fff}
.os-report-box h3{margin:0 0 2.5mm;font-size:9pt}
.os-report-bars{display:flex;flex-direction:column;gap:1.5mm}
.os-report-bar-row{display:grid;grid-template-columns:28mm 1fr 8mm;gap:2mm;align-items:center;font-size:6.6pt}
.os-report-bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.os-report-bar-track{height:2.5mm;background:#f0ecee;border-radius:99px;overflow:hidden}
.os-report-bar-fill{height:100%;background:#ed2e91;border-radius:99px}
.os-report-bar-value{text-align:right;font-weight:850}
.os-report-mini-table{width:100%;border-collapse:collapse;table-layout:fixed}
.os-report-mini-table th,.os-report-mini-table td{padding:1.5mm 1.4mm;border-bottom:1px solid #eee9ec;font-size:6.6pt;line-height:1.2}
.os-report-mini-table th{background:#faf8f9;color:#645d62;font-size:6pt;text-transform:uppercase}
.os-report-detail-title{display:flex;justify-content:space-between;align-items:end;gap:4mm;margin:4mm 0 3mm}
.os-report-detail-title h2{margin:0;font-size:13pt}
.os-report-detail-title span{color:#6f676c;font-size:7pt}
.os-report-detail-table{width:100%;border-collapse:collapse;table-layout:fixed}
.os-report-detail-table th,.os-report-detail-table td{padding:1.35mm 1.1mm;border-bottom:1px solid #e8e2e5;font-size:5.9pt;line-height:1.16;vertical-align:top;overflow-wrap:anywhere}
.os-report-detail-table th{background:#f6f3f5;color:#5f575c;font-size:5.5pt;font-weight:850;text-transform:uppercase}
.os-report-detail-table th:nth-child(1){width:8%}.os-report-detail-table th:nth-child(2){width:7%}.os-report-detail-table th:nth-child(3){width:15%}.os-report-detail-table th:nth-child(4){width:7%}.os-report-detail-table th:nth-child(5){width:7%}.os-report-detail-table th:nth-child(6){width:13%}.os-report-detail-table th:nth-child(7){width:29%}.os-report-detail-table th:nth-child(8){width:14%}
.os-report-motive{display:inline-block;padding:.7mm 1.4mm;border-radius:99px;background:#fff0f8;color:#be176d;font-weight:850}
.os-report-note{margin-top:3mm;color:#6f676c;font-size:6.5pt;line-height:1.35}

.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(120px,1fr) 2.2fr 34px;align-items:center;gap:9px}
.bar-label{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;background:#f0ecee;border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--pink);border-radius:999px}
.bar-value{text-align:right;font-size:12px;font-weight:800}

.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:visible;background:#fff}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:9px 8px;border-bottom:1px solid #eee9ec;font-size:11px;text-align:left;vertical-align:top;overflow-wrap:anywhere;line-height:1.3}
th{background:#faf8f9;color:#645d62;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:var(--pink-pale);color:var(--pink-dark);font-size:10px;font-weight:800;text-transform:uppercase}
.pending-pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#fff0df;color:#a15a16;font-size:10px;font-weight:850;text-transform:uppercase}
.resolved-pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#e7f5f0;color:var(--good);font-size:10px;font-weight:850;text-transform:uppercase}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #d7ced3;border-radius:12px}

.summary-actions{display:flex;justify-content:flex-end;margin-bottom:14px}
.summary-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.summary-kpi{position:relative;min-height:145px;padding:20px 20px 17px}
.summary-kpi-label{max-width:78%;color:#625b61;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}
.summary-kpi-value{margin-top:9px;font-size:36px;line-height:1;font-weight:950}
.summary-kpi-sub{margin-top:11px;color:#52505c;font-size:12px;line-height:1.35}
.summary-kpi.good .summary-kpi-value{color:var(--good)}
.summary-kpi.warn .summary-kpi-value{color:var(--warn)}
.summary-kpi.bad .summary-kpi-value{color:var(--bad)}
.summary-icon{position:absolute;top:25px;right:20px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.summary-icon svg{width:25px;height:25px}
.summary-icon.green{background:#e4f6f0;color:var(--good)}
.summary-icon.pink{background:#fde7f3;color:var(--pink)}
.summary-progress{display:flex;align-items:center;gap:9px;margin-top:10px}
.summary-progress-track{flex:1;height:9px;border-radius:999px;background:#e4eeea;overflow:hidden}
.summary-progress-fill{height:100%;border-radius:999px;background:var(--good)}
.summary-progress-value{min-width:40px;color:var(--good);font-size:11px;font-weight:900;text-align:right}
.summary-lower-grid{display:grid;grid-template-columns:minmax(0,1.27fr) minmax(0,.98fr);gap:14px;align-items:stretch}
.summary-alert-area{padding:16px}
.summary-title{margin:0 0 13px;font-size:17px}
.summary-alert-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.alert-card{position:relative;min-height:190px;padding:18px 17px 16px;overflow:hidden;box-shadow:none}
.alert-card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px}
.alert-card.mechanical{background:#fffaf5}
.alert-card.mechanical:before{background:#f27a0b}
.alert-card.auxiliary{background:#f5faff}
.alert-card.auxiliary:before{background:#2585dc}
.alert-card.detours{background:#faf9fa}
.alert-card.detours:before{background:#625b63}
.alert-card.good:before{background:var(--good)}
.alert-head{display:flex;align-items:center;gap:10px;min-height:42px}
.alert-icon{width:42px;height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.alert-icon svg{width:22px;height:22px}
.alert-card.mechanical .alert-icon{background:#fff0dd;color:#f07800}
.alert-card.auxiliary .alert-icon{background:#e3f1ff;color:#2585dc}
.alert-card.detours .alert-icon{background:#ece9ed;color:#625b63}
.alert-card-title{color:#5b555a;font-size:10px;line-height:1.25;font-weight:850;text-transform:uppercase;letter-spacing:.04em}
.alert-card-number{margin-top:10px;font-size:34px;font-weight:950}
.alert-card-detail{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.alert-detail-row{display:flex;align-items:flex-start;gap:8px;color:#29242a;font-size:12px;line-height:1.35;font-weight:500}
.alert-detail-dot{width:6px;height:6px;flex:0 0 6px;margin-top:5px;border-radius:50%;background:var(--pink)}
.alert-card.mechanical .alert-detail-dot{background:#f07800}
.alert-card.detours .alert-detail-dot{background:#9e5591}
.alert-additional-btn{appearance:none;border:0;background:transparent;padding:0;margin:2px 0 0;color:var(--muted);font:inherit;font-size:11px;text-align:left;cursor:pointer}
.alert-additional-btn:hover{color:var(--ink);text-decoration:underline}
.alert-extra-list{display:none;flex-direction:column;gap:8px}
.alert-card.expanded .alert-extra-list{display:flex}
.alert-card.expanded{min-height:auto}
.alert-none{margin-top:18px;color:var(--good);font-size:12px;font-weight:600}
.impact-panel{padding:17px 20px 20px}
.impact-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:24px}
.impact-head h3{margin:0;font-size:16px}
.impact-head span{color:var(--muted);font-size:10px}
.impact-chart{display:flex;flex-direction:column;gap:16px}
.impact-row{display:grid;grid-template-columns:42px minmax(0,1fr) 28px;align-items:center;gap:10px}
.impact-line{font-size:12px;font-weight:850}
.impact-track{height:13px;border-radius:999px;background:#eceaec;overflow:hidden}
.impact-fill{height:100%;background:var(--pink);border-radius:999px}
.impact-value{text-align:right;font-size:12px;font-weight:850}
.impact-empty{padding:35px 10px;text-align:center;color:var(--muted)}
.plan-hero{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-bottom:14px}
.gauge-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}
.gauge{--p:0;--gauge-color:var(--pink);position:relative;width:154px;height:154px;border-radius:50%;background:conic-gradient(var(--gauge-color) calc(var(--p)*1%),#eee8eb 0);display:grid;place-items:center}
.gauge:after{content:"";position:absolute;width:116px;height:116px;border-radius:50%;background:#fff}
.gauge-content{position:relative;z-index:1;text-align:center}
.gauge-content b{font-size:29px}
.gauge-content span{display:block;color:var(--muted);font-size:11px}

<script>

const API_URL='https://script.google.com/macros/s/AKfycbxzu1Mob_Z7E0-33nMXmFDk1zsaOWnUyzb1s58z1NH_2qDK4utHfvtO9-N31GtMuYwyEA/exec';

const URL_PARAMS=new URLSearchParams(window.location.search);
const PROFILE=String(URL_PARAMS.get('perfil')||'').trim().toLowerCase();
const IS_GUARD_PROFILE=PROFILE==='guardia';
const IS_CONDUCTION_PROFILE=PROFILE==='conduccion';
const IS_RECORRIDOS_PROFILE=PROFILE==='recorridos';

const ALL_TABS=['resumen','conduccion','plan','salidas','guardia','os','kpi','graficos','recorridos'];

const ALLOWED_TABS=
IS_RECORRIDOS_PROFILE
?['recorridos']
:IS_CONDUCTION_PROFILE
?['conduccion']
:IS_GUARD_PROFILE
?['resumen','conduccion','plan','salidas','guardia','os']
:ALL_TABS;

const REQUESTED_TAB=String(URL_PARAMS.get('tab')||'').trim().toLowerCase();

function sanitizeTab(tab){
const value=String(tab||'').trim().toLowerCase();
if(ALLOWED_TABS.includes(value))return value;
if(IS_RECORRIDOS_PROFILE)return 'recorridos';
if(IS_CONDUCTION_PROFILE)return 'conduccion';
if(IS_GUARD_PROFILE)return 'guardia';
return 'resumen';
}

function sectionAllowedForProfile(section){
if(IS_RECORRIDOS_PROFILE)return false;
if(IS_CONDUCTION_PROFILE){
return ['planServ','salidas','guardia'].includes(section);
}
if(IS_GUARD_PROFILE&&(section==='kpi'||section==='graficos'))return false;
return true;
}

if(IS_GUARD_PROFILE)document.body.classList.add('profile-guardia');
if(IS_CONDUCTION_PROFILE)document.body.classList.add('profile-conduccion');
if(IS_RECORRIDOS_PROFILE)document.body.classList.add('profile-recorridos');

const LOCAL_CACHE_KEY='TSJ_DASHBOARD_CACHE_V24';
const LOCAL_CACHE_MAX_AGE=12*60*60*1000;
const REQUEST_TIMEOUT=45000;

function dashboardName(value){
const raw=String(value??'').trim();
if(!raw)return '';

const format=text=>
String(text||'')
.toLocaleLowerCase('es-AR')
.replace(
/(^|[\s'’\-])([a-záéíóúüñ])/g,
(_,sep,ch)=>sep+ch.toLocaleUpperCase('es-AR')
);

const match=
raw.match(
/^(\d{2,8})(?:\s*[-–—]\s*|\s+)(.+)$/
);

return match
?match[1]+' '+format(match[2])
:format(raw);
}

function dashboardCode(value){

.trim()
.toLocaleUpperCase('es-AR');
}

function delayPill(value){
const raw=String(value??'').trim();

if(!raw)return '—';

const parsed=
parseFloat(
raw
.replace(',','.')
.replace(/[^0-9.\-]/g,'')
);

const label=
Number.isFinite(parsed)
?parsed.toLocaleString('es-AR')+' min'
:raw;

return Number.isFinite(parsed)&&parsed>0
?`<span class="pill">${esc(label)}</span>`
:esc(label);
}

function restoreLocalSnapshot(){
try{
const raw=localStorage.getItem(LOCAL_CACHE_KEY);
if(!raw)return false;
const snapshot=JSON.parse(raw);
const age=Date.now()-Number(snapshot.savedAt||0);
if(!snapshot.data||age>LOCAL_CACHE_MAX_AGE)return false;
DATA=snapshot.data;
['planServ','salidas','guardia','os','kpi','graficos'].forEach(section=>{
if(DATA[section]){
READY[section]=true;
VERSION[section]=1;
SECTION_LAST_SUCCESS[section]=0;
}
});
return true;
}catch(err){return false}
}

function saveLocalSnapshot(){
if(CACHE_SAVE_TIMER)clearTimeout(CACHE_SAVE_TIMER);

CACHE_SAVE_TIMER=setTimeout(()=>{
try{
localStorage.setItem(LOCAL_CACHE_KEY,JSON.stringify({savedAt:Date.now(),data:DATA}));
}catch(err){}
CACHE_SAVE_TIMER=null;
},CACHE_SAVE_DELAY);

function todayISO(){
const p=DATA.period||{};
return p.year&&p.month&&p.day?`${p.year}-${pad2(p.month)}-${pad2(p.day)}`:'';
}

function selectedISO(tab=ACTIVE_TAB){
return DATE_BY_TAB[tab]||todayISO();
}

function selectedDDMM(tab=ACTIVE_TAB){
const m=selectedISO(tab).match(/^(\d{4})-(\d{2})-(\d{2})$/);
return m?`${m[3]}/${m[2]}`:'';
}

function selectedLabel(tab=ACTIVE_TAB){
const v=selectedISO(tab);
return v?new Date(v+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}):'';
}

function sameDay(value,key){
const m=String(value||'').match(/^(\d{1,2})[\/-](\d{1,2})/);
return !!m&&`${pad2(+m[1])}/${pad2(+m[2])}`===key;
}

function kpiDefaultISO(){
const p=DATA.period||{};
if(!p.year||!p.month||!p.day)return '';

const yesterday=new Date(
Number(p.year),
Number(p.month)-1,
Number(p.day)-1,
12
);

if(
yesterday.getFullYear()===Number(p.year)
&&
(yesterday.getMonth()+1)===Number(p.month)
){
return `${yesterday.getFullYear()}-${pad2(yesterday.getMonth()+1)}-${pad2(yesterday.getDate())}`;
}

const days=(DATA.kpi?.daily||[])
.map(x=>{
const m=String(x.date||'').match(/^(\d{1,2})[\/-](\d{1,2})/);
return m&&+m[2]===+p.month?+m[1]:0;
})
.filter(d=>d>0&&d<=+p.day)
.sort((a,b)=>b-a);

const d=days[0]||1;
return `${p.year}-${pad2(p.month)}-${pad2(d)}`;
}
function monthLabel(){
const p=DATA.period||{};
return p.month&&p.year
?new Date(p.year,p.month-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'})
:'';
}

function shortDateLabel(ddmm){
const m=String(ddmm||'').match(/^(\d{1,2})[\/-](\d{1,2})/);
if(!m)return ddmm||'';
const mon=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m[2]-1];
return `${+m[1]}-${mon}`;
}

function countBy(rows,field){
const out={};
(rows||[]).forEach(r=>{
const k=String(r[field]||'Sin dato').trim()||'Sin dato';
out[k]=(out[k]||0)+1;
});
return Object.entries(out)
.map(([label,value])=>({label,value}))
.sort((a,b)=>b.value-a.value||a.label.localeCompare(b.label));
}

function sortByLine(rows){
return [...(rows||[])].sort((a,b)=>
String(a.linea||'').localeCompare(String(b.linea||''),'es',{numeric:true})
);
}

function sortByLineAndService(rows){
return [...(rows||[])].sort((a,b)=>
String(a.linea||'').localeCompare(String(b.linea||''),'es',{numeric:true})
||
String(a.turno||a.servicio||'').localeCompare(String(b.turno||b.servicio||''),'es',{numeric:true})
);
}

function normalizeBaseLine(value){
let line=String(value||'').trim().toUpperCase().replace(/\s+/g,'');
if(!line)return '';
if(line==='P'||line==='P1'||line==='P2')return line;
const match=line.match(/^([A-Z]+)(?:\/?\d+)?$/);
return match?match[1]:line;
}

function countByNormalizedLine(rows){
const counts={};
(rows||[]).forEach(row=>{
const line=normalizeBaseLine(row.linea);
if(!line)return;
counts[line]=(counts[line]||0)+1;
});
return Object.entries(counts)
.map(([label,value])=>({label,value}))
.sort((a,b)=>b.value-a.value||a.label.localeCompare(b.label,'es',{numeric:true}));
}

function normalizeText(value){
return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
}

function isValidAbsenceRow(row){
const raw=String(
row?.conductor
||
row?.chofer
||
row?.nombre
||
row?.legajo
||
''
).trim();

if(!raw)return false;

const conductor=normalizeText(raw);

/* Una fila sólo es novedad si identifica a una persona:
   - legajo numérico, o
   - nombre/apellido con letras.
   Separadores, guiones, puntos o celdas de plantilla no cuentan. */
const hasLegajo=
/\b\d{2,8}\b/.test(raw);

const hasName=
/[A-ZÁÉÍÓÚÜÑ]/i.test(raw);

if(!hasLegajo&&!hasName)return false;

const placeholders=[
'---','----','-----','------','-------','--------',
'.........','........','.......','......','.....','....','...'
];

if(placeholders.includes(raw))return false;

const invalid=[
'LLEGADAS TARDE','LLEGADA TARDE','OBSERVACIONES','PLAN DIARIO',
'REEMPLAZOS DE CONDUCTORES','REEMPLAZO DE CONDUCTORES',
'REEMPLAZOS DE UNIDADES','REEMPLAZO DE UNIDADES',
'INASISTENCIAS RELEVANTES','INASISTENCIAS RELEVANTE',
'CHOFER','CONDUCTOR','ESTADO','TURNO'
];

return !invalid.some(
value=>
conductor===value
||
conductor.startsWith(value+' ')
);
}

function normalizeMechanicalCategory(value){
const original=String(value||'').trim();
const v=normalizeText(original);
if(!v)return 'Mecánica';
if(v.includes('GPS'))return 'GPS';
if(v.includes('PINCH')||v.includes('NEUM')||v.includes('CUBIERTA')||v.includes('RUEDA')||v.includes('GOMA'))return 'Neumático';
if(v.includes('MOTOR')||v.includes('ACEITE')||v.includes('RADIADOR')||v.includes('TEMPERAT'))return 'Motor';
if(v.includes('TRANSM')||v.includes('CAJA')||v.includes('EMBRAG'))return 'Transmisión';
if(v.includes('FREN'))return 'Frenos';
if(v.includes('ELECTR')||v.includes('BATERIA')||v.includes('ALTERNADOR'))return 'Electricidad';
if(v.includes('TABLERO')||v.includes('INSTRUMENT'))return 'Instrumental';
if(v.includes('PUERTA')||v.includes('RAMPA')||v.includes('ESPEJO')||v.includes('ASIENTO'))return 'Accesorio';
return original;
}

function stripLeadingLegajo(value){
return String(value||'').trim().replace(/^\d{2,8}(?:\s*[-–—]\s*|\s+)/,'').trim();
}

function personWords(value){
return normalizeText(stripLeadingLegajo(value))
.replace(/[^A-Z0-9Ñ]+/g,' ')
.trim().split(/\s+/).filter(Boolean);
}

function personNamesMatch(a,b){
const aw=personWords(a);
const bw=personWords(b);
if(!aw.length||!bw.length)return false;
const as=aw.join(' ');
const bs=bw.join(' ');
if(as===bs)return true;
const shorter=aw.length<=bw.length?aw:bw;
const longer=aw.length<=bw.length?bw:aw;
return shorter.every(word=>longer.includes(word));
}

function getTitularLegajo(row){
const candidates=[row?.legajoTitular,row?.legajoConductor,row?.legajo,row?.nroLegajo,row?.numeroLegajo];
for(const value of candidates){
const text=String(value??'').trim();
if(/^\d{2,8}$/.test(text))return text;
}
const source=row?.titular||row?.conductor||row?.chofer||'';
const match=String(source).trim().match(/^(\d{2,8})(?:\s|[-–—])/);
return match?match[1]:'';
}

function replacementCompleteness(row){
const fields=[row?.titular,row?.reemplazo,row?.motivo,row?.linea,row?.turno,getTitularLegajo(row)];
return fields.reduce((total,value)=>total+(String(value??'').trim()?1:0),0);
}

function replacementSurname(row){
const values=[
row?.titular,
row?.conductor,
row?.chofer,
row?.apellido,
row?.legajo
];

for(const value of values){
let text=String(value??'').trim();
if(!text)continue;

text=stripLeadingLegajo(text);

if(!text)continue;

const surname=
text.includes(',')
?text.split(',')[0].trim()
:text.split(/\s+/)[0].trim();

const normalized=
normalizeText(surname);

if(
normalized
&&
!/^[0-9]+$/.test(normalized)
){
return normalized;
}
}

return '';
}

function sameDriverReplacement(a,b){
const legajoA=getTitularLegajo(a);
const legajoB=getTitularLegajo(b);

if(
legajoA
&&
legajoB
&&
legajoA===legajoB
){
return true;
}

const surnameA=replacementSurname(a);
const surnameB=replacementSurname(b);

if(
surnameA
&&
surnameB
&&
surnameA===surnameB
){
return true;
}

return personNamesMatch(
a?.titular||a?.conductor||a?.chofer||a?.legajo,
b?.titular||b?.conductor||b?.chofer||b?.legajo
);
}

function mergeDriverReplacements(planRows,guardRows){
const result=[];
[...(planRows||[]),...(guardRows||[])].forEach(row=>{
const index=result.findIndex(existing=>sameDriverReplacement(existing,row));
if(index===-1){result.push(row);return}
if(replacementCompleteness(row)>replacementCompleteness(result[index])){
result[index]=row;
}
});
return result;
}

function extractNumericPrefix(value){
const match=String(value||'').trim().match(/^(\d{2,8})(?:\s+|\s*[-–—]\s*)/);
return match?match[1]:'';
}

function getDriverLegajo(row){
const values=[
row?.legajo,
row?.legajoTitular,
row?.legajoConductor,
row?.nroLegajo,
row?.numeroLegajo,
row?.legajoReemplazo,
row?.reemplazoLegajo
];

for(const value of values){
const text=String(value??'').trim();
if(/^\d{2,8}$/.test(text))return text;
}

return extractNumericPrefix(row?.titular)
||extractNumericPrefix(row?.conductor)
||extractNumericPrefix(row?.chofer)
||extractNumericPrefix(row?.reemplazo)
||'';
}

function getDriverSurname(row){
const values=[row?.apellido,row?.titular,row?.conductor,row?.chofer,row?.reemplazo,row?.nombre];
for(let value of values){
if(!String(value||'').trim())continue;
let text=String(value).replace(/^\d{2,8}(?:\s*[-–—]\s*|\s+)/,'').trim();
if(text.includes(','))return text.split(',')[0].trim();
return text.split(/\s+/)[0];
}
return '';
}

function getDriverReference(row){
return getDriverLegajo(row)||getDriverSurname(row)||'';
}

function uniqueDriverReferences(rows){
const map=new Map();

(rows||[]).forEach(row=>{
const value=getDriverReference(row);
if(!value)return;

const key=normalizeText(value);

if(!map.has(key)){
map.set(key,value);
}
});

return [...map.values()];
}

function dedupeDriverRecords(rows,extraFields=[]){
const seen=new Set();
return (rows||[]).filter(row=>{
const legajo=getDriverLegajo(row);
const person=normalizeText(stripLeadingLegajo(
row?.conductor||row?.chofer||row?.titular||row?.reemplazo||row?.nombre||''
));
const extras=extraFields.map(field=>normalizeText(row?.[field])).join('|');
const key=[
legajo||person,
normalizeText(row?.fecha),
normalizeText(row?.turno),
extras
].join('|');
if(seen.has(key))return false;
seen.add(key);
return true;
});
}

function compactList(values,limit=5){
const clean=[...new Set((values||[]).map(x=>String(x??'').trim()).filter(Boolean))];
if(!clean.length)return '—';
const visible=clean.slice(0,limit);
const more=clean.length-visible.length;
return visible.join(', ')+(more>0?` +${more}`:'');
}

function renderAlertCases(rows,emptyText){
if(!rows.length)return `<div class="alert-none">${esc(emptyText)}</div>`;
const visible=rows.slice(0,3);
const hidden=rows.slice(3);
const more=hidden.length;

const renderRow=r=>`
<div class="alert-detail-row">
<span class="alert-detail-dot"></span>
<span>${esc(normalizeMechanicalCategory(r.falla))} · Int. ${esc(r.interno||'-')}</span>
</div>`;

return `<div class="alert-card-detail">
${visible.map(renderRow).join('')}
${
more>0
?`<div class="alert-extra-list">${hidden.map(renderRow).join('')}</div>
<button type="button" class="alert-additional-btn" data-count="${more}" aria-expanded="false" onclick="toggleAlertCard(this)">
+${more} ${more===1?'adicional':'adicionales'}
</button>`
:''
}
</div>`;
}

function toggleAlertCard(button){
const card=button.closest('.alert-card');
if(!card)return;
const expanded=card.classList.toggle('expanded');
const count=Number(button.dataset.count||0);
button.setAttribute('aria-expanded',expanded?'true':'false');
button.textContent=expanded?'Ver menos':`+${count} ${count===1?'adicional':'adicionales'}`;
}

function renderImpactChart(detours){
const rows=countByNormalizedLine(detours).slice(0,5);
if(!rows.length)return `<div class="impact-empty">Sin desvíos para la jornada.</div>`;
const max=Math.max(...rows.map(x=>Number(x.value||0)),1);
return `<div class="impact-chart">${
rows.map(row=>`
<div class="impact-row">
<div class="impact-line">${esc(row.label)}</div>
<div class="impact-track"><div class="impact-fill" style="width:${Math.max(7,Number(row.value||0)/max*100)}%"></div></div>
<div class="impact-value">${num(row.value)}</div>
</div>`).join('')
}</div>`;
}

const guardDrivers=(guardia.driverRows||[]).filter(r=>sameDay(r.fecha,key));

const driverReferences=uniqueDriverReferences(drivers);

(salidas.lateRows||[]).filter(r=>sameDay(r.fecha,key)),

);

);

function osHistoryRows(){
const d=DATA.os||{};
return Array.isArray(d.historyRows)?d.historyRows:Array.isArray(d.allRows)?d.allRows:(d.rows||[]);
}

function osDriverIdentity(row){
const legajo=String(row?.legajo||'').trim();
const nombre=String(row?.nombre||row?.conductor||'').trim();
return {legajo,nombre,key:legajo||normalizeText(nombre)};
}

function osDriverCatalog(){
if(OS_DRIVER_CATALOG_VERSION===VERSION.os){
return OS_DRIVER_CATALOG;
}

const map=new Map();
osHistoryRows().forEach(row=>{
const id=osDriverIdentity(row);
if(!id.key)return;
if(!map.has(id.key))map.set(id.key,{key:id.key,legajo:id.legajo,nombre:id.nombre,count:0});
const item=map.get(id.key);
item.count++;
if(!item.legajo&&id.legajo)item.legajo=id.legajo;
if(!item.nombre&&id.nombre)item.nombre=id.nombre;
});
OS_DRIVER_CATALOG=[...map.values()].sort((a,b)=>b.count-a.count||String(a.nombre||'').localeCompare(String(b.nombre||''),'es'));
OS_DRIVER_CATALOG_VERSION=VERSION.os;
return OS_DRIVER_CATALOG;
}

function osHistoryDateValue(value){
const text=String(value||'').trim();
const match=text.match(/^(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?/);
if(!match)return 0;
const day=Number(match[1]);
const month=Number(match[2]);
let year=Number(match[3]||DATA.period?.year||new Date().getFullYear());
if(year<100)year+=2000;
return new Date(year,month-1,day).getTime();
}

function osHistoryRowsForKey(key){
if(!key)return [];
return osHistoryRows()
.filter(row=>osDriverIdentity(row).key===key)
.sort((a,b)=>osHistoryDateValue(b.fecha)-osHistoryDateValue(a.fecha));
}

function osMostFrequentReason(rows){
const result=countBy(rows,'motivo');
return result[0]?.label||'—';
}

function osLatestDate(rows){
return rows.length?(rows[0]?.fecha||'—'):'—';
}

function renderOSHistorySuggestions(){
const box=$('#osDriverSuggestions');
if(!box)return;
const query=normalizeText(OS_HISTORY_QUERY);
if(!query){box.classList.remove('show');box.innerHTML='';return;}

const matches=osDriverCatalog().filter(item=>{
const haystack=normalizeText((item.legajo||'')+' '+(item.nombre||''));
return haystack.includes(query);
}).slice(0,10);

if(!matches.length){
box.innerHTML=`<div class="os-history-empty" style="margin:8px">Sin coincidencias.</div>`;
box.classList.add('show');
return;
}

box.innerHTML=matches.map(item=>`
<button type="button" class="os-suggestion" onclick="selectOSHistoryDriver('${esc(item.key)}')">
<span>
<div class="os-suggestion-main">${esc((item.legajo?item.legajo+' · ':'')+dashboardName(item.nombre))}</div>
<div class="os-suggestion-sub">Histórico de órdenes de servicio</div>
</span>
<span class="os-suggestion-count">${num(item.count)} OS</span>
</button>`).join('');
box.classList.add('show');
}

function renderOSHistoryPanel(){
const root=$('#osHistoryResult');
if(!root)return;
if(!OS_HISTORY_SELECTED_KEY){root.innerHTML='';return;}

const rows=osHistoryRowsForKey(OS_HISTORY_SELECTED_KEY);
const catalogItem=osDriverCatalog().find(x=>x.key===OS_HISTORY_SELECTED_KEY);
const legajo=catalogItem?.legajo||rows[0]?.legajo||'—';
const nombre=catalogItem?.nombre||rows[0]?.nombre||'';
const mainReason=osMostFrequentReason(rows);
const latest=osLatestDate(rows);

root.innerHTML=`
<article class="os-history-panel">
<div class="os-history-head">
<div>
<h3>Histórico de OS · ${esc(legajo)} ${esc(dashboardName(nombre))}</h3>
<div class="sub">Consulta acumulada de todos los meses disponibles en la fuente OS</div>
</div>
<button type="button" class="refresh" onclick="clearOSHistorySearch()">Limpiar</button>
</div>

<div class="os-history-kpis">
<div class="os-history-kpi"><div class="label">Total de OS históricas</div><div class="value">${num(rows.length)}</div></div>
<div class="os-history-kpi"><div class="label">Última OS emitida</div><div class="value">${esc(latest)}</div></div>
<div class="os-history-kpi"><div class="label">Motivo más frecuente</div><div class="value" style="font-size:15px">${mainReason&&mainReason!=='—'?`<span class="pill">${esc(mainReason)}</span>`:'—'}</div></div>
</div>

${table([
['Fecha','fecha'],
['Legajo','legajo'],
['Conductor','nombre',v=>esc(dashboardName(v))],
['Línea','linea',v=>esc(dashboardCode(v))],
['Interno','interno'],
['Motivo','motivo',v=>v?`<span class="pill">${esc(v)}</span>`:'—'],
['Observación','observacion'],

],rows)}

<div class="os-history-note">El histórico contempla todos los meses entregados por el backend en <strong>os.historyRows</strong>.</div>
</article>`;

function handleOSDriverSearch(value){
OS_HISTORY_QUERY=String(value||'');
OS_HISTORY_SELECTED_KEY='';
renderOSHistorySuggestions();
renderOSHistoryPanel();

function kpiValue(v){
if(v===null||v===undefined)return '—';

const s=String(v).trim();

if(
!s
||
s.startsWith('#')
||
s==='-'
||
s==='-%'
){
return '—';
}

return s;
}

function fmtPct(v){
const s=kpiValue(v);

if(s==='—')return s;

return s.includes('%')
?s
:s+'%';
}

function kpiRowStatus(row){
if(!row){
return{
complete:false,
label:'Sin datos KPI para el día seleccionado'
};
}

const fields=[
'planCumplimiento',
'kmCumplimiento',
'hsCumplimiento',
'titularidad',
'ipk',
'horarioGeneral',
'horarioCab',
'horarioPorton',
'estetica'
];

const valid=
fields.filter(
field=>kpiValue(row[field])!=='—'
).length;

const complete=
valid===fields.length;

return{
complete:complete,
label:complete
?'Datos consolidados'
:'Datos parciales · pendiente de actualización'
};
}

function rawNumber(v){
if(v===null||v===undefined||v==='')return null;

const raw=String(v).trim();

if(
!raw
||
raw.startsWith('#')
||
raw==='—'
||
raw==='-'
||
raw==='-%'
){
return null;
}

let s=raw.replace('%','').replace(/\s/g,'');

if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');

const n=parseFloat(s.replace(/[^0-9.\-]/g,''));

return Number.isFinite(n)?n:null;
}

function metricPass(value,meta){
const n=rawNumber(value);
const t=rawNumber(meta);if(n===null||t===null)return null;

const s=String(meta||'').replace(/\s+/g,'');

if(s.includes('≤')||s.includes('<='))return n<=t;
if(s.includes('≥')||s.includes('>='))return n>=t;

return n>=t;
}

function metricProgress(value){
const n=rawNumber(value);
if(n===null)return 0;
return Math.max(0,Math.min(100,n));
}

function kpiCard(metric,dateLabel){
const pass=metric.meta?metricPass(metric.raw,metric.meta):null;
const status=
pass===true?'status-good':
pass===false?'status-bad':
'';

return `
<article class="kpi-ref-card ${status}">
<div class="metric-label">${esc(metric.label)}</div>
<div class="metric-value">${esc(metric.display)}</div>
<div class="metric-sub">Dato del día · ${esc(dateLabel)}</div>
<div class="metric-track">
<div class="metric-fill" style="width:${metricProgress(metric.raw)}%"></div>
</div>
</article>`;
}

function uniqueMonthlyIndicators(rows){
const order=[];
const map=new Map();

(rows||[]).forEach(item=>{
const key=normalizeText(item?.label||'');
if(!key)return;

if(!map.has(key)){
order.push(key);
map.set(key,{...item});
return;
}

const previous=map.get(key);
const next={...previous};

Object.entries(item||{}).forEach(([field,value])=>{
if(value!==undefined&&value!==null&&String(value).trim()!==''){
next[field]=value;
}
});

map.set(key,next);
});

return order.map(key=>map.get(key));
}

function graphParseNumber(value){
if(value===null||value===undefined||value==='')return null;

let s=String(value).trim().replace('%','').replace(/\s/g,'');

if(/^-?\d{1,3}(?:\.\d{3})+(?:,\d+)?$/.test(s)){
s=s.replace(/\./g,'').replace(',','.');
}else if(s.includes(',')&&s.includes('.')){
if(s.lastIndexOf(',')>s.lastIndexOf('.')){
s=s.replace(/\./g,'').replace(',','.');
}else{
s=s.replace(/,/g,'');
}
}else if(s.includes(',')){
s=s.replace(',','.');
}

const n=parseFloat(s.replace(/[^0-9.\-]/g,''));
return Number.isFinite(n)?n:null;
}

function niceChartMax(values,metas,fixedMax=null){
if(fixedMax!==null)return fixedMax;

const nums=[
...(values||[]),
...(metas||[])
].filter(value=>Number.isFinite(value));

if(!nums.length)return 1;

const raw=Math.max(...nums,1);
const padded=raw*1.15;
const power=Math.pow(10,Math.floor(Math.log10(padded)));

return Math.ceil(padded/power*2)/2*power;
}

function chartDisplayValue(value,type){
if(value===null||!Number.isFinite(value))return '';

if(type==='percent'){
return (Math.round(value*10)/10).toLocaleString('es-AR')+'%';
}

if(type==='ipk'){
return value.toLocaleString('es-AR',{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

return Math.round(value).toLocaleString('es-AR');
}

function graphMetaChangeLabels(metas){
const out=[];
let previous=null;
let previousFinite=false;

(metas||[]).forEach((value,index)=>{
if(!Number.isFinite(value)){
previous=null;
previousFinite=false;
return;
}

if(
!previousFinite
||
previous===null
||
Math.abs(Number(value)-Number(previous))>.000001
){
out.push({index,value});
}

previous=value;
previousFinite=true;
});

return out;
}

function graphLineSegments(
metas,
left,
slot,
width,
right,
y,
extendEdges
){
const segments=[];
let current=[];

(metas||[]).forEach((value,index)=>{
if(!Number.isFinite(value)){
if(current.length){
segments.push(current);
current=[];
}
return;
}

current.push({
index,
x:left+slot*index+slot/2,
y:y(value),
value
});
});

if(current.length)segments.push(current);

return segments.map(segment=>{
const points=[];

if(extendEdges&&segment.length){
const first=segment[0];
const startX=first.index===0
?left
:Math.max(left,first.x-slot/2);
points.push(`${startX},${first.y}`);
}

segment.forEach(item=>{
points.push(`${item.x},${item.y}`);
});

if(extendEdges&&segment.length){
const last=segment[segment.length-1];
const endX=last.index===11
?width-right
:Math.min(width-right,last.x+slot/2);

points.push(`${endX},${last.y}`);
}

return points;
});
}

function mergePayload(payload){
if(!payload)return;

if(payload.period){
DATA.period=payload.period;
}

if(payload.generatedAt){
DATA.generatedAt=payload.generatedAt;
}

DATA.sources={
...(DATA.sources||{}),
...(payload.sources||{})
};

[
'planServ',
'salidas',
'guardia',
'os',
'kpi',
'graficos'
].forEach(section=>{

if(payload[section]===undefined)return;

if(!sectionAllowedForProfile(section))return;

if(
payload.ok===false
&&
READY[section]
){
return;
}

DATA[section]=payload[section];
READY[section]=true;
VERSION[section]++;
SECTION_LAST_SUCCESS[section]=Date.now();

});

saveLocalSnapshot();
configureDatePicker();
scheduleActiveRender();
updateLastUpdate();
}

function requestStaticSection(section){

const url=
STATIC_DATA_BASE
+
'/'
+
encodeURIComponent(section)
+
'.json?_='
+
Date.now();

return fetch(
url,
{
cache:'no-store',
mode:'cors'
}
)
.then(response=>{

if(!response.ok){
throw new Error('Cache HTTP '+response.status);
}

return response.json();

})
.then(payload=>{

if(
!payload
||
payload.ok===false
||
payload[section]===undefined
){
throw new Error('Cache incompleto');
}

mergePayload(payload);

return payload;

});
}

function requestLiveSection(
section,
force=false,
retry=1
){

if(!sectionAllowedForProfile(section)){
return Promise.resolve(null);
}

if(LIVE_INFLIGHT[section]){
return LIVE_INFLIGHT[section];
}

const promise=
new Promise((resolve,reject)=>{

const cb=
'tsj_cb_'
+
Date.now()
+
'_'
+
Math.random().toString(36).slice(2);

const script=document.createElement('script');

let finished=false;

const cleanup=()=>{
clearTimeout(timer);

try{
delete window[cb];
}catch(err){}

script.remove();
};

const fail=reason=>{
if(finished)return;

finished=true;
cleanup();

reject(new Error(reason));
};

window[cb]=payload=>{

if(finished)return;

finished=true;
cleanup();

mergePayload(payload);

if(payload?.ok===false){
reject(
new Error(
(payload.errors||[]).join(' · ')
||
'Respuesta parcial'
)
);
return;
}

resolve(payload);
};

script.onerror=
()=>fail('No se pudo conectar con la fuente de datos.');

const timer=setTimeout(
()=>fail('La fuente de datos demoró demasiado.'),
REQUEST_TIMEOUT
);

let url=
API_URL
+
'?section='
+
encodeURIComponent(section)
+
'&callback='
+
encodeURIComponent(cb)
+
'&_='
+
Date.now();

if(force){
url+='&force=1';
}

script.src=url;
document.body.appendChild(script);

})
.catch(err=>{

if(retry>0&&!force){

if(LIVE_INFLIGHT[section]===promise){
delete LIVE_INFLIGHT[section];
}

return new Promise(resolve=>
setTimeout(resolve,900)
)
.then(()=>
requestLiveSection(
section,
false,
retry-1
)
);

}

throw err;

})
.finally(()=>{

if(LIVE_INFLIGHT[section]===promise){
delete LIVE_INFLIGHT[section];
}

});

LIVE_INFLIGHT[section]=promise;

return promise;
}

function requestSection(
section,
force=false,
retry=1
){

if(!sectionAllowedForProfile(section)){
return Promise.resolve(null);
}

if(INFLIGHT[section]){
return INFLIGHT[section];
}

const promise=
requestStaticSection(section)

.then(payload=>{

/* Mostrar primero la copia rápida. Si la copia quedó vieja o el usuario
   pidió Actualizar, validar en vivo en segundo plano sin bloquear la interfaz. */
const generatedAt=
Date.parse(payload?.generatedAt||'');

const stale=
!Number.isFinite(generatedAt)
||
Date.now()-generatedAt>STATIC_DATA_MAX_AGE;

if(force||stale){
requestLiveSection(
section,
force,
0
)
.catch(()=>{});
}

return payload;

})

.catch(()=>
requestLiveSection(
section,
force,
retry
)
)

.finally(()=>{

if(INFLIGHT[section]===promise){
delete INFLIGHT[section];
}

});

INFLIGHT[section]=promise;

return promise;
}

function clearSilentRetry(section){

if(SILENT_RETRY_TIMERS[section]){
clearTimeout(SILENT_RETRY_TIMERS[section]);
delete SILENT_RETRY_TIMERS[section];
}

SILENT_RETRY_ATTEMPTS[section]=0;
}

function scheduleSilentRetry(section){

if(
!section
||
!sectionAllowedForProfile(section)
||
SILENT_RETRY_TIMERS[section]
){
return;
}

const attempt=Number(SILENT_RETRY_ATTEMPTS[section]||0);

if(attempt>=SILENT_RETRY_DELAYS.length)return;

const delay=SILENT_RETRY_DELAYS[attempt];

SILENT_RETRY_ATTEMPTS[section]=attempt+1;

SILENT_RETRY_TIMERS[section]=setTimeout(()=>{

delete SILENT_RETRY_TIMERS[section];

requestSection(section,false,0)
.then(()=>{

clearSilentRetry(section);

setStatus(
true,
'Datos disponibles'
);

})
.catch(()=>{

if(hasAnyVisibleData()){
setStatus(true,'Datos disponibles');
}

scheduleSilentRetry(section);

});

},delay);
}

function ensureSectionFresh(section){
if(!section||!sectionAllowedForProfile(section)){
return Promise.resolve(null);
}

const lastSuccess=
Number(SECTION_LAST_SUCCESS[section]||0);

if(
READY[section]
&&
lastSuccess>0
&&
Date.now()-lastSuccess<SECTION_REFRESH_TTL
){
return Promise.resolve(null);
}

return requestSection(section,false,0)
.then(payload=>{
clearSilentRetry(section);
setStatus(true,'Datos disponibles');

.catch(()=>{

if(hasAnyVisibleData()){

return null;
});
}

function reportDateParts(value){
const match=String(value||'').match(/^(\d{1,2})[\/-](\d{1,2})/);

if(!match)return null;

return{
day:Number(match[1]),
month:Number(match[2])
};
}

function reportReasonLabel(value){
const text=String(value||'').trim();
return text||'Sin motivo';
}

function reportAggregate(rows,getter){

const map=new Map();

(rows||[]).forEach(row=>{

const raw=String(getter(row)??'').trim();

if(!raw)return;

const key=normalizeText(raw);

if(!map.has(key)){
map.set(key,{
label:raw,
value:0
});
}else{

const current=map.get(key);

if(
current.label===current.label.toUpperCase()
&&
raw!==raw.toUpperCase()
){
current.label=raw;
}

}

map.get(key).value++;

});

return [...map.values()]
.sort((a,b)=>
b.value-a.value
||
String(a.label).localeCompare(
String(b.label),
'es',
{numeric:true}
)
);
}

function getUnitsReportRows(){

const d=DATA.salidas||{};

const selected=
reportDateParts(
selectedDDMM('salidas')
);

if(!selected)return [];

return [...(d.unitRows||[])]

.filter(row=>{

const parts=
reportDateParts(row.fecha);

if(!parts)return false;

if(parts.month!==selected.month){
return false;
}

if(parts.day>selected.day){
return false;
}

return(
String(row.averia||'').trim()
&&
String(row.reemplazo||'').trim()
);

})

.sort((a,b)=>{

const da=
reportDateParts(a.fecha)?.day
||
0;

const db=
reportDateParts(b.fecha)?.day
||
0;

return(
da-db

||

String(a.linea||'')
.localeCompare(
String(b.linea||''),
'es',
{numeric:true}
)

||

String(
a.turno
||
a.servicio
||
''
)
.localeCompare(
String(
b.turno
||
b.servicio
||
''
),
'es',
{numeric:true}
)
);

});

}

/* =========================================================
   REPORTE MENSUAL DE OS
========================================================= */

function osReportAggregate(rows,getter){
const map=new Map();

(rows||[]).forEach(row=>{
const label=String(getter(row)||'').trim()||'Sin especificar';
const key=normalizeText(label);
if(!map.has(key))map.set(key,{label,value:0});
map.get(key).value++;
});

return [...map.values()].sort((a,b)=>b.value-a.value||a.label.localeCompare(b.label,'es',{numeric:true}));
}

function osReportBarsHtml(items,limit=12){
const data=(items||[]).slice(0,limit);
if(!data.length)return '<div class="empty">Sin datos.</div>';
const max=Math.max(...data.map(item=>Number(item.value)||0),1);

return `<div class="os-report-bars">${data.map(item=>`
<div class="os-report-bar-row">
<div class="os-report-bar-label">${esc(item.label)}</div>
<div class="os-report-bar-track"><div class="os-report-bar-fill" style="width:${Math.max(4,(Number(item.value)||0)/max*100)}%"></div></div>
<div class="os-report-bar-value">${num(item.value)}</div>
</div>`).join('')}</div>`;
}

function osReportMiniTableHtml(title,rows,leftLabel,limit=10){
const data=(rows||[]).slice(0,limit);
return `<div class="os-report-box">
<h3>${esc(title)}</h3>
<table class="os-report-mini-table"><thead><tr><th>${esc(leftLabel)}</th><th>Cant.</th></tr></thead><tbody>
${data.length?data.map(item=>`<tr><td>${esc(item.label)}</td><td><strong>${num(item.value)}</strong></td></tr>`).join(''):'<tr><td colspan="2">Sin datos.</td></tr>'}
</tbody></table></div>`;
}

function osReportDetailTableHtml(rows){
return `<table class="os-report-detail-table"><thead><tr>
<th>Fecha</th><th>Legajo</th><th>Conductor</th><th>Línea</th><th>Interno</th><th>Motivo</th><th>Observación</th><th>Agente</th>
</tr></thead><tbody>${(rows||[]).map(row=>`<tr>
<td>${esc(row.fecha||'—')}</td><td>${esc(row.legajo||'—')}</td><td>${esc(dashboardName(row.nombre)||'—')}</td>
<td>${esc(dashboardCode(row.linea)||'—')}</td><td>${esc(row.interno||'—')}</td>
<td>${row.motivo?`<span class="os-report-motive">${esc(row.motivo)}</span>`:'—'}</td>
<td>${esc(row.observacion||'—')}</td><td>${esc(dashboardName(row.agente)||'—')}</td>
</tr>`).join('')}</tbody></table>`;
}

function osReportDateValue(value){
const text=String(value||'').trim();
const match=text.match(/^(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?/);
if(!match)return Number.MAX_SAFE_INTEGER;
return Number(match[3]||0)*10000+Number(match[2])*100+Number(match[1]);
}

function buildOSReport(){
const d=DATA.os||{};
const summary=d.summary||{};
const rows=[...(d.rows||[])].sort((a,b)=>osReportDateValue(a.fecha)-osReportDateValue(b.fecha)||String(a.nombre||'').localeCompare(String(b.nombre||''),'es'));
const reasons=osReportAggregate(rows,row=>row.motivo);
const lines=osReportAggregate(rows,row=>dashboardCode(row.linea));
const drivers=osReportAggregate(rows,row=>{
const name=dashboardName(row.nombre);
return row.legajo?`${row.legajo} · ${name||'Sin nombre'}`:(name||'Sin conductor');
});
const period=monthLabel();
const metrics=[
['OS del mes',summary.total??rows.length,'Acumulado mensual'],
['Siniestros',summary.siniestros??0,'Acumulado mensual'],
['Incumpl. horario',summary.horario??0,'Acumulado mensual'],
['Incumpl. directivas',summary.directivas??0,'Acumulado mensual'],
['Vandalismo',summary.vandalismo??0,'Acumulado mensual']
];

const summaryPage=`<section class="os-report-sheet">
<div class="os-report-header"><div class="os-report-brand"><img class="os-report-logo" src="logo-tsj.png" alt="TSJ"><div class="os-report-company">TRANSPORTE SAN JOSÉ S.A.</div></div><div class="os-report-period">Órdenes de servicio<br>Período: ${esc(period)}</div></div>
<h1 class="os-report-title">Reporte mensual de órdenes de servicio</h1>
<p class="os-report-subtitle">Resumen de registros OS, distribución y conductores con mayor cantidad de intervenciones.</p>
<div class="os-report-kpis">${metrics.map(metric=>`<div class="os-report-kpi"><div class="os-report-kpi-label">${esc(metric[0])}</div><div class="os-report-kpi-value">${num(metric[1])}</div><div class="os-report-kpi-sub">${esc(metric[2])}</div></div>`).join('')}</div>
<div class="os-report-summary-grid">
<div class="os-report-box"><h3>OS por motivo</h3>${osReportBarsHtml(reasons,12)}</div>
${osReportMiniTableHtml('OS por línea',lines,'Línea',10)}
${osReportMiniTableHtml('Conductores con registros',drivers,'Conductor',10)}
</div>
<div class="os-report-note">Total de registros detallados: <strong>${num(rows.length)}</strong>. Documento de uso interno.</div>
</section>`;

if(!rows.length)return summaryPage;

const pageSize=20;
const detailPages=[];
for(let start=0;start<rows.length;start+=pageSize){
const page=detailPages.length+2;
const chunk=rows.slice(start,start+pageSize);
detailPages.push(`<section class="os-report-sheet">
<div class="os-report-header"><div class="os-report-brand"><img class="os-report-logo" src="logo-tsj.png" alt="TSJ"><div class="os-report-company">TRANSPORTE SAN JOSÉ S.A.</div></div><div class="os-report-period">Detalle mensual de OS<br>${esc(period)}</div></div>
<div class="os-report-detail-title"><h2>Detalle completo de órdenes de servicio</h2><span>Página ${page}</span></div>
${osReportDetailTableHtml(chunk)}
</section>`);
}
return summaryPage+detailPages.join('');
}

function exportOSReport(){
const root=$('#osReportRoot');
if(!root)return;
const previousTitle=document.title;
root.innerHTML=buildOSReport();
root.setAttribute('aria-hidden','false');
document.title=`TSJ_Reporte_OS_${String(monthLabel()).replace(/\s+/g,'_')}`;
document.body.classList.add('print-os-report');

cleaned=true;
document.body.classList.remove('print-os-report');
root.setAttribute('aria-hidden','true');
root.innerHTML='';
document.title=previousTitle;

window.addEventListener('afterprint',cleanup,{once:true});

}
