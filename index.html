<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TSJ | Rutina de regularidad y frecuencia</title>

<style>

:root{
  --ink:#181416;
  --muted:#746d72;
  --pink:#ed2e91;
  --pink-dark:#be176d;
  --pink-pale:#fff0f8;
  --line:#e9e4e7;
  --paper:#ffffff;
  --bg:#f6f4f5;
  --good:#0b9b73;
  --warn:#d77817;
  --bad:#c43351;
  --blue:#2f80d0;
  --shadow:0 10px 30px rgba(44,30,39,.07);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  font-size:15px;
}

button,
input{
  font:inherit;
}

.shell{
  max-width:1500px;
  margin:auto;
  padding:24px 28px 48px;
}


/* =========================================================
   CABECERA
========================================================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:24px;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.brand-logo{
  width:118px;
  height:auto;
}

.brand-name{
  font-size:14px;
  font-weight:850;
  letter-spacing:.1em;
}

.status-wrap{
  display:flex;
  align-items:center;
  gap:12px;
}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--warn);
}

.dot.ok{
  background:var(--good);
}

.refresh,
.export-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:9px 13px;
  font-weight:800;
  cursor:pointer;
}

.export-btn{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}


/* =========================================================
   TITULO
========================================================= */

.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:18px;
}

.hero h1{
  font-size:32px;
  line-height:1.04;
  letter-spacing:-1.2px;
  margin:0;
}

.date-control{
  display:flex;
  background:var(--ink);
  border-radius:12px;
  padding:7px 10px;
}

.date-control input{
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-weight:800;
  color-scheme:dark;
}

.date-control.hidden{
  display:none;
}


/* =========================================================
   SOLAPAS
========================================================= */

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  padding:5px;
  background:#ece8ea;
  border-radius:14px;
  margin-bottom:22px;
}

.tab{
  border:0;
  background:transparent;
  color:#5f585d;
  font-weight:800;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  background:#fff;
  color:var(--ink);
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.tab-panel{
  display:none;
}

.tab-panel.active{
  display:block;
}


/* =========================================================
   GENERALES
========================================================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:12px;
  margin:6px 0 14px;
}

.section-head h2{
  font-size:22px;
  margin:0;
}

.source{
  color:var(--muted);
  font-size:12px;
  text-align:right;
}

.kpis{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin-bottom:16px;
}

.kpi,
.panel,
.mini,
.gauge-card,
.kpi-ref-card,
.kpi-month-panel,
.summary-kpi,
.alert-card,
.summary-alert-area,
.impact-panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
}

.kpi{
  padding:17px;
  min-height:116px;
}

.kpi .label,
.mini .t{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.kpi .value{
  font-size:31px;
  font-weight:900;
  margin-top:8px;
}

.kpi .sub{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}

.kpi.good .value,
.mini.good .n{
  color:var(--good);
}

.kpi.warn .value{
  color:var(--warn);
}

.kpi.bad .value,
.mini.bad .n{
  color:var(--bad);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.panel{
  padding:18px;
  margin-bottom:14px;
  overflow:hidden;
}

.panel h3{
  margin:0 0 15px;
  font-size:15px;
}

.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.count-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:28px;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
}

.count-badge.blue{
  background:#e9f2fc;
  color:#326aa5;
}

.count-badge.orange{
  background:#fff0df;
  color:#a15a16;
}

.count-badge.pink{
  background:#fff0f8;
  color:var(--pink-dark);
}


/* =========================================================
   PLANILLERIA
========================================================= */

.planillaria-board{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;
  align-items:stretch;
  margin-bottom:14px;
}

.planillaria-left{
  display:grid;
  grid-template-rows:auto 1fr;
  gap:14px;
  min-width:0;
}

.planillaria-right{
  display:grid;
  grid-template-rows:repeat(2,1fr);
  gap:14px;
  min-width:0;
}

.planillaria-board .panel{
  margin-bottom:0;
  min-width:0;
}

.planillaria-right .panel{
  height:100%;
}

.planillaria-driver-table th,
.planillaria-driver-table td{
  padding:8px 7px;
}


/* =========================================================
   BARRAS
========================================================= */

.bars{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.bar-row{
  display:grid;
  grid-template-columns:minmax(120px,1fr) 2.2fr 34px;
  align-items:center;
  gap:9px;
}

.bar-label{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.track{
  height:9px;
  background:#f0ecee;
  border-radius:999px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:var(--pink);
  border-radius:999px;
}

.bar-value{
  text-align:right;
  font-size:12px;
  font-weight:800;
}


/* =========================================================
   TABLAS
========================================================= */

.table-wrap{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:visible;
  background:#fff;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,
td{
  padding:9px 8px;
  border-bottom:1px solid #eee9ec;
  font-size:11px;
  text-align:left;
  vertical-align:top;
  overflow-wrap:anywhere;
  line-height:1.3;
}

th{
  background:#faf8f9;
  color:#645d62;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.pill{
  display:inline-flex;
  border-radius:999px;
  padding:4px 8px;
  background:var(--pink-pale);
  color:var(--pink-dark);
  font-size:10px;
  font-weight:800;
}

.pending-pill{
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  background:#fff0df;
  color:#a15a16;
  font-size:10px;
  font-weight:850;
}

.resolved-pill{
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  background:#e7f5f0;
  color:var(--good);
  font-size:10px;
  font-weight:850;
}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #d7ced3;
  border-radius:12px;
}


/* =========================================================
   RESUMEN
========================================================= */

.summary-actions{
  display:flex;
  justify-content:flex-end;
  margin-bottom:14px;
}

.summary-kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}

.summary-kpi{
  position:relative;
  min-height:145px;
  padding:20px 20px 17px;
}

.summary-kpi-label{
  max-width:78%;
  color:#625b61;
  font-size:11px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.summary-kpi-value{
  margin-top:9px;
  font-size:36px;
  line-height:1;
  font-weight:950;
}

.summary-kpi-sub{
  margin-top:11px;
  color:#52505c;
  font-size:12px;
  line-height:1.35;
}

.summary-kpi.good .summary-kpi-value{
  color:var(--good);
}

.summary-kpi.warn .summary-kpi-value{
  color:var(--warn);
}

.summary-kpi.bad .summary-kpi-value{
  color:var(--bad);
}

.summary-icon{
  position:absolute;
  top:25px;
  right:20px;
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.summary-icon svg{
  width:25px;
  height:25px;
}

.summary-icon.green{
  background:#e4f6f0;
  color:var(--good);
}

.summary-icon.pink{
  background:#fde7f3;
  color:var(--pink);
}

.summary-progress{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:10px;
}

.summary-progress-track{
  flex:1;
  height:9px;
  border-radius:999px;
  background:#e4eeea;
  overflow:hidden;
}

.summary-progress-fill{
  height:100%;
  border-radius:999px;
  background:var(--good);
}

.summary-progress-value{
  min-width:40px;
  color:var(--good);
  font-size:11px;
  font-weight:900;
  text-align:right;
}

.summary-lower-grid{
  display:grid;
  grid-template-columns:minmax(0,1.27fr) minmax(0,.98fr);
  gap:14px;
  align-items:stretch;
}

.summary-alert-area{
  padding:16px;
}

.summary-title{
  margin:0 0 13px;
  font-size:17px;
}

.summary-alert-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.alert-card{
  position:relative;
  min-height:190px;
  padding:18px 17px 16px;
  overflow:hidden;
  box-shadow:none;
}

.alert-card:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:5px;
}

.alert-card.mechanical{
  background:#fffaf5;
}

.alert-card.mechanical:before{
  background:#f27a0b;
}

.alert-card.auxiliary{
  background:#f5faff;
}

.alert-card.auxiliary:before{
  background:#2585dc;
}

.alert-card.detours{
  background:#faf9fa;
}

.alert-card.detours:before{
  background:#625b63;
}

.alert-card.good:before{
  background:var(--good);
}

.alert-head{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:42px;
}

.alert-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.alert-icon svg{
  width:22px;
  height:22px;
}

.alert-card.mechanical .alert-icon{
  background:#fff0dd;
  color:#f07800;
}

.alert-card.auxiliary .alert-icon{
  background:#e3f1ff;
  color:#2585dc;
}

.alert-card.detours .alert-icon{
  background:#ece9ed;
  color:#625b63;
}

.alert-card-title{
  color:#5b555a;
  font-size:10px;
  line-height:1.25;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.alert-card-number{
  margin-top:10px;
  font-size:34px;
  font-weight:950;
}

.alert-card-detail{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:13px;
}

.alert-detail-row{
  display:flex;
  align-items:flex-start;
  gap:8px;
  color:#29242a;
  font-size:12px;
  line-height:1.35;
  font-weight:500;
}

.alert-detail-dot{
  width:6px;
  height:6px;
  flex:0 0 6px;
  margin-top:5px;
  border-radius:50%;
  background:var(--pink);
}

.alert-card.mechanical .alert-detail-dot{
  background:#f07800;
}

.alert-card.detours .alert-detail-dot{
  background:#9e5591;
}

.alert-additional{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}

.alert-none{
  margin-top:18px;
  color:var(--good);
  font-size:12px;
  font-weight:600;
}

.impact-panel{
  padding:17px 20px 20px;
}

.impact-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:24px;
}

.impact-head h3{
  margin:0;
  font-size:16px;
}

.impact-head span{
  color:var(--muted);
  font-size:10px;
}

.impact-chart{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.impact-row{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) 28px;
  align-items:center;
  gap:10px;
}

.impact-line{
  font-size:12px;
  font-weight:850;
}

.impact-track{
  height:13px;
  border-radius:999px;
  background:#eceaec;
  overflow:hidden;
}

.impact-fill{
  height:100%;
  background:var(--pink);
  border-radius:999px;
}

.impact-value{
  text-align:right;
  font-size:12px;
  font-weight:850;
}

.impact-empty{
  padding:35px 10px;
  text-align:center;
  color:var(--muted);
}


/* =========================================================
   PLAN SERV
========================================================= */

.plan-hero{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:16px;
  margin-bottom:14px;
}

.gauge-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:22px;
}

.gauge{
  --p:0;
  --gauge-color:var(--pink);
  position:relative;
  width:154px;
  height:154px;
  border-radius:50%;
  background:
    conic-gradient(
      var(--gauge-color)
      calc(var(--p)*1%),
      #eee8eb 0
    );
  display:grid;
  place-items:center;
}

.gauge:after{
  content:"";
  position:absolute;
  width:116px;
  height:116px;
  border-radius:50%;
  background:#fff;
}

.gauge-content{
  position:relative;
  z-index:1;
  text-align:center;
}

.gauge-content b{
  font-size:29px;
}

.gauge-content span{
  display:block;
  color:var(--muted);
  font-size:11px;
}

.gauge-label{
  margin-top:12px;
  font-weight:850;
}

.plan-main{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.mini{
  padding:17px;
}

.mini .n{
  margin-top:6px;
  font-size:26px;
  font-weight:900;
}

.mini.good{
  background:#f6fbf9;
}

.mini.bad{
  background:#fff6f8;
}

.plan-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.hero-stat{
  background:var(--ink);
  color:#fff;
  border-radius:16px;
  padding:20px;
}

.hero-stat .over{
  font-size:11px;
  color:#c8c3c6;
  text-transform:uppercase;
  font-weight:800;
}

.hero-stat .big{
  margin-top:7px;
  font-size:32px;
  font-weight:900;
}

.hero-stat .small{
  margin-top:3px;
  color:#d7d2d5;
  font-size:13px;
}

.service-note{
  margin:-2px 0 14px;
  border-left:4px solid var(--good);
  background:#eef8f4;
  color:#17684f;
  border-radius:0 12px 12px 0;
  padding:11px 14px;
  font-size:13px;
  font-weight:750;
}


/* =========================================================
   GUARDIA
========================================================= */

#guardia .kpi{
  padding:17px;
  min-height:116px;
}

.guard-mechanical-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}

.guard-mechanical-grid .panel{
  margin-bottom:0;
}

.aux-panel{
  border-top:5px solid var(--blue);
}

.mechanical-panel{
  border-top:5px solid var(--warn);
}

.driver-panel{
  border-top:5px solid var(--pink);
}

.detour-panel{
  border-top:5px solid #746d72;
}

.shift-block{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  background:#fff;
  margin-top:14px;
}

.shift-title{
  display:flex;
  justify-content:space-between;
  padding:14px 16px;
  font-size:14px;
  font-weight:950;
  text-transform:uppercase;
}

.shift-title.morning{
  color:#245e1b;
  background:#dff0d7;
  border-left:7px solid #4c9538;
}

.shift-title.afternoon{
  color:#934b00;
  background:#ffe4c3;
  border-left:7px solid #d77817;
}

.shift-count{
  padding:5px 10px;
  border-radius:999px;
  background:#fff;
  font-size:10px;
}

.shift-body{
  padding:13px 14px;
}

.guard-event{
  display:grid;
  grid-template-columns:8px 1fr;
  gap:10px;
  font-size:12px;
  line-height:1.5;
}

.guard-event-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  margin-top:6px;
  background:var(--pink);
}


/* =========================================================
   KPI
========================================================= */

.kpi-dashboard{
  display:grid;
  grid-template-columns:1.8fr 1fr;
  gap:18px;
}

.kpi-card-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.kpi-ref-card{
  padding:17px 18px;
  min-height:155px;
}

.metric-label{
  color:#655e63;
  font-size:12px;
  font-weight:800;
}

.metric-value{
  font-size:31px;
  font-weight:900;
  margin:7px 0;
}

.metric-sub{
  color:var(--muted);
  font-size:11px;
}

.metric-track{
  height:6px;
  background:#eee9ec;
  border-radius:999px;
  overflow:hidden;
  margin-top:13px;
}

.metric-fill{
  height:100%;
  background:var(--good);
}

.kpi-month-panel{
  padding:22px 24px;
}

.kpi-month-row{
  display:grid;
  grid-template-columns:1fr auto 86px;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #ece7ea;
}

.kpi-badge{
  min-width:82px;
  text-align:center;
  border-radius:999px;
  padding:6px 10px;
  background:#e7f5f0;
  color:var(--good);
  font-size:11px;
  font-weight:900;
}


/* =========================================================
   PIE
========================================================= */

.error{
  display:none;
  background:#fff5f2;
  border:1px solid #f1cfc4;
  color:#8c3825;
  border-radius:12px;
  padding:11px 14px;
  margin-bottom:14px;
}

.error.show{
  display:block;
}

.foot{
  margin-top:24px;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

  .kpis{
    grid-template-columns:repeat(3,1fr);
  }

  .summary-kpis{
    grid-template-columns:repeat(2,1fr);
  }

  .summary-lower-grid,
  .planillaria-board,
  .plan-hero,
  .kpi-dashboard,
  .guard-mechanical-grid{
    grid-template-columns:1fr;
  }

  .planillaria-right{
    grid-template-rows:auto auto;
  }

  .plan-main{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:720px){

  .shell{
    padding:18px 14px 35px;
  }

  .top,
  .hero,
  .section-head{

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxzu1Mob_Z7E0-33nMXmFDk1zsaOWnUyzb1s58z1NH_2qDK4utHfvtO9-N31GtMuYwyEA/exec';


let DATA = {};
let ACTIVE_TAB = 'resumen';


const DATE_BY_TAB = {
  resumen:'',
  salidas:'',
  guardia:'',
  kpi:''
};


const $ =
  s => document.querySelector(s);


const esc =
  v =>
    String(v ?? '')
      .replace(
        /[&<>"']/g,
        m => ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#039;'
        }[m])
      );


const num =
  v =>
    Number(v || 0)
      .toLocaleString('es-AR');


const pad2 =
  v =>
    String(v).padStart(2,'0');


/* =========================================================
   ICONOS
========================================================= */

function svgIcon(type){

  const common =
    `fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"`;


  if(type === 'check'){

    `;

  if(type === 'bus'){

    return `
      <svg viewBox="0 0 24 24">
        <rect x="5" y="3" width="14" height="16" rx="3" ${common}></rect>
        <path d="M7 7h10M7 14h10" ${common}></path>
        <circle cx="8" cy="17" r="1" fill="currentColor"></circle>
        <circle cx="16" cy="17" r="1" fill="currentColor"></circle>
      </svg>
    `;
  }


  if(type === 'users'){

    return `
      <svg viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3" ${common}></circle>
        <path d="M3.5 19c.4-4 2.4-6 5.5-6s5.1 2 5.5 6" ${common}></path>
        <circle cx="17" cy="9" r="2.2" ${common}></circle>
      </svg>
    `;
  }


  if(type === 'clock'){

    return `
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" ${common}></circle>
        <path d="M12 7v5l3 2" ${common}></path>
      </svg>

  if(type === 'gear'){

    return `
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" ${common}></circle>
        <circle cx="12" cy="12" r="8" ${common}></circle>
      </svg>
    `;

  if(type === 'wrench'){

    return `
      <svg viewBox="0 0 24 24">
        <path
          d="M14.5 6.5a5 5 0 0 0-6.8 6.1L3 17.3A2.6 2.6 0 0 0 6.7 21l4.7-4.7a5 5 0 0 0 6.1-6.8l-3 3-3-3Z"
          ${common}
        ></path>
      </svg>
    `;
  }


  if(type === 'road'){

    return `
      <svg viewBox="0 0 24 24">
        <path d="M8 3 5 21M16 3l3 18" ${common}></path>
        <path d="M12 4v3M12 10v4M12 17v3" ${common}></path>
      </svg>
    `;
  }


  return '';
}


/* =========================================================
   UTILIDADES
========================================================= */

function sourceLabel(src){

  return src?.name
    ? `Fuente: ${esc(src.name)}`
    : 'Fuente no disponible';
}


function kpi(
  label,
  value,
  sub='',
  tone=''
){

  return `
    <article class="kpi ${tone}">
      <div class="label">${esc(label)}</div>
      <div class="value">${esc(value)}</div>
      <div class="sub">${esc(sub)}</div>
    </article>
  `;
}


function mini(
  title,
  value,
  tone=''
){

  return `
    <article class="mini ${tone}">
      <div class="t">${esc(title)}</div>
      <div class="n">${esc(value)}</div>
    </article>
  `;
}


function table(headers,rows){

  if(!rows?.length){

    return `
      <div class="empty">
        Sin registros.
      </div>
    `;
  }


  return `
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            ${
              headers
                .map(
                  h =>
                    `<th>${esc(h[0])}</th>`
                )
                .join('')
            }
          </tr>
        </thead>

        <tbody>

          ${
            rows
              .map(
                r => `
                  <tr>

                    ${
                      headers
                        .map(
                          h => `
                            <td>

                              ${
                                h[2]
                                  ? h[2](r[h[1]],r)
                                  : esc(r[h[1]] ?? '')
                              }

                            </td>
                          `
                        )
                        .join('')
                    }

                  </tr>
                `
              )
              .join('')
          }

        </tbody>

      </table>

    </div>
  `;
}


function bars(items,limit=12){

  const a =
    (items || []).slice(0,limit);


  if(!a.length){

    return `
      <div class="empty">
        Sin datos para mostrar.
      </div>
    `;
  }


  const max =
    Math.max(
      ...a.map(x => +x.value || 0),
      1
    );


  return `
    <div class="bars">

      ${
        a.map(
          x => `

            <div class="bar-row">

              <div class="bar-label">
                ${esc(x.label)}
              </div>

              <div class="track">

                <div
                  class="fill"
                  style="
                    width:${
                      Math.max(
                        3,
                        (+x.value || 0) / max * 100
                      )
                    }%
                  "
                ></div>

              </div>

              <div class="bar-value">
                ${num(x.value)}
              </div>

            </div>

          `
        ).join('')
      }

    </div>
  `;
}


/* =========================================================
   FECHAS
========================================================= */

function todayISO(){

  const p =
    DATA.period || {};


  return (
    p.year &&
    p.month &&
    p.day
  )
    ? `${p.year}-${pad2(p.month)}-${pad2(p.day)}`
    : '';
}


function selectedISO(tab=ACTIVE_TAB){

  return (
    DATE_BY_TAB[tab]
    ||
    todayISO()
  );
}


function selectedDDMM(tab=ACTIVE_TAB){

  const m =
    selectedISO(tab)
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  return m
    ? `${m[3]}/${m[2]}`
    : '';
}


function selectedLabel(tab=ACTIVE_TAB){

  const v =
    selectedISO(tab);


  return v
    ? new Date(
        v + 'T12:00:00'
      )
      .toLocaleDateString(
        'es-AR',
        {
          day:'2-digit',
          month:'long',
          year:'numeric'
        }
      )
    : '';
}


function sameDay(value,key){

  const m =
    String(value || '')
      .match(
        /^(\d{1,2})[\/-](\d{1,2})/
      );


  return (
    !!m
    &&
    `${pad2(+m[1])}/${pad2(+m[2])}`
    ===
    key
  );
}


function kpiDefaultISO(){

  const p =
    DATA.period || {};


  const days =
    (DATA.kpi?.daily || [])
      .map(
        x => {

          const m =
            String(x.date || '')
              .match(
                /^(\d{1,2})[\/-](\d{1,2})/
              );


          return (
            m &&
            +m[2] === +p.month
          )
            ? +m[1]
            : 0;
        }
      )
      .filter(
        d =>
          d > 0 &&
          d < +p.day
      )
      .sort(
        (a,b) =>
          b-a
      );


  const d =
    days[0]
    ||
    Math.max(
      1,
      (+p.day || 1)-1
    );


  return p.year
    ? `${p.year}-${pad2(p.month)}-${pad2(d)}`
    : '';
}


function monthLabel(){

  const p =
    DATA.period || {};


  return (
    p.month &&
    p.year
  )
    ? new Date(
        p.year,
        p.month-1,
        1
      )
      .toLocaleDateString(
        'es-AR',
        {
          month:'long',
          year:'numeric'
        }
      )
    : '';
}


function shortDateLabel(ddmm){

  const m =
    String(ddmm || '')
      .match(
        /^(\d{1,2})[\/-](\d{1,2})/
      );


  if(!m){
    return ddmm || '';
  }


  const mon = [
    'ene','feb','mar','abr',
    'may','jun','jul','ago',
    'sep','oct','nov','dic'
  ][+m[2]-1];


  return `${+m[1]}-${mon}`;
}


/* =========================================================
   AGRUPACION
========================================================= */

function countBy(rows,field){

  const out = {};


  (rows || [])
    .forEach(
      r => {

        const k =
          String(
            r[field] ||
            'Sin dato'
          )
          .trim()
          ||
          'Sin dato';


        out[k] =
          (out[k] || 0)
          +
          1;
      }
    );


  return Object
    .entries(out)
    .map(
      ([label,value]) => ({
        label,
        value
      })
    )
    .sort(
      (a,b) =>
        b.value -
        a.value
        ||
        a.label.localeCompare(b.label)
    );
}


function sortByLine(rows){

  return [
    ...(rows || [])
  ]
  .sort(
    (a,b) =>
      String(a.linea || '')
        .localeCompare(
          String(b.linea || ''),
          'es',
          {numeric:true}
        )
  );
}


function sortByLineAndService(rows){

  return [
    ...(rows || [])
  ]
  .sort(
    (a,b) =>

      String(a.linea || '')
        .localeCompare(
          String(b.linea || ''),
          'es',
          {numeric:true}
        )

      ||

      String(
        a.turno ||
        a.servicio ||
        ''
      )
      .localeCompare(
        String(
          b.turno ||
          b.servicio ||
          ''
        ),
        'es',
        {numeric:true}
      )
  );
}


/* =========================================================
   LINEAS
========================================================= */

function normalizeBaseLine(value){

  let line =
    String(value || '')
      .trim()
      .toUpperCase()
      .replace(/\s+/g,'');


  if(!line){
    return '';
  }


  if(
    line === 'P'
    ||
    line === 'P1'
    ||
    line === 'P2'
  ){
    return line;
  }


  const match =
    line.match(
      /^([A-Z]+)(?:\/?\d+)?$/
    );


  return match
    ? match[1]
    : line;
}


function countByNormalizedLine(rows){

  const counts = {};


  (rows || [])
    .forEach(
      row => {

        const line =
          normalizeBaseLine(
            row.linea
          );


        if(!line){
          return;
        }


        counts[line] =
          (counts[line] || 0)
          +
          1;
      }
    );


  return Object
    .entries(counts)
    .map(
      ([label,value]) => ({
        label,
        value
      })
    )
    .sort(
      (a,b) =>
        b.value -
        a.value
        ||
        a.label.localeCompare(
          b.label,
          'es',
          {numeric:true}
        )
    );
}


/* =========================================================
   MECANICA
========================================================= */

function normalizeText(value){

  return String(value || '')
    .normalize('NFD')
    .replace(
      /[\u0300-\u036f]/g,
      ''
    )
    .trim()
    .toUpperCase();
}


function normalizeMechanicalCategory(value){

  const original =
    String(value || '').trim();


  const v =
    normalizeText(original);


  if(!v){
    return 'Mecánica';
  }


  if(v.includes('GPS')){
    return 'GPS';
  }


  if(
    v.includes('PINCH')
    ||
    v.includes('NEUM')
    ||
    v.includes('CUBIERTA')
    ||
    v.includes('RUEDA')
    ||
    v.includes('GOMA')
  ){
    return 'Neumático';
  }


  if(
    v.includes('MOTOR')
    ||
    v.includes('ACEITE')
    ||
    v.includes('RADIADOR')
    ||
    v.includes('TEMPERAT')
  ){
    return 'Motor';
  }


  if(
    v.includes('TRANSM')
    ||
    v.includes('CAJA')
    ||
    v.includes('EMBRAG')
  ){
    return 'Transmisión';
  }


  if(v.includes('FREN')){
    return 'Frenos';
  }


  if(
    v.includes('ELECTR')
    ||
    v.includes('BATERIA')
    ||
    v.includes('ALTERNADOR')
  ){
    return 'Electricidad';
  }


  if(
    v.includes('TABLERO')
    ||
    v.includes('INSTRUMENT')
  ){
    return 'Instrumental';
  }


  if(
    v.includes('PUERTA')
    ||
    v.includes('RAMPA')
    ||
    v.includes('ESPEJO')
    ||
    v.includes('ASIENTO')
  ){
    return 'Accesorio';
  }


  return original;
}


/* =========================================================
   CONDUCTORES
========================================================= */

function normalizePerson(value){

  return String(value || '')
    .normalize('NFD')
    .replace(
      /[\u0300-\u036f]/g,
      ''
    )
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ''
    );
}


function normalizeTurn(value){

  return String(value || '')
    .trim()
    .toUpperCase()
    .replace(/\s+/g,'');
}


function sameDriverReplacement(a,b){

  const titularA =
    normalizePerson(a?.titular);

  const titularB =
    normalizePerson(b?.titular);

  const replA =
    normalizePerson(a?.reemplazo);

  const replB =
    normalizePerson(b?.reemplazo);


  if(
    titularA &&
    titularB &&
    replA &&
    replB &&
    titularA === titularB &&
    replA === replB
  ){
    return true;
  }


  if(
    replA &&
    replB &&
    replA === replB
  ){

    const lineA =
      normalizeBaseLine(a?.linea);

    const lineB =
      normalizeBaseLine(b?.linea);


    if(
      lineA &&
      lineB &&
      lineA === lineB
    ){
      return true;
    }
  }


  return false;
}


function mergeDriverReplacements(
  planRows,
  guardRows
){

  const result =
    [
      ...(planRows || [])
    ];


  (guardRows || [])
    .forEach(
      row => {

        if(
          !result.some(
            existing =>
              sameDriverReplacement(
                existing,
                row
              )
          )
        ){
          result.push(row);
        }
      }
    );


  return result;
}


function extractNumericPrefix(value){

  const match =
    String(value || '')
      .trim()
      .match(
        /^(\d{2,8})\s*[-–—]/
      );


  return match
    ? match[1]
    : '';
}


function getDriverLegajo(row){

  const values = [

    row?.legajo,
    row?.legajoTitular,
    row?.legajoConductor,
    row?.nroLegajo,
    row?.numeroLegajo,
    row?.legajoReemplazo,
    row?.reemplazoLegajo

  ];


  for(const v of values){

    if(
      v !== undefined
      &&
      v !== null
      &&
      String(v).trim()
    ){
      return String(v).trim();
    }
  }


  return (
    extractNumericPrefix(row?.titular)
    ||
    extractNumericPrefix(row?.conductor)
    ||
    extractNumericPrefix(row?.chofer)
    ||
    extractNumericPrefix(row?.reemplazo)
    ||
    ''
  );
}


function getDriverSurname(row){

  const values = [

    row?.apellido,
    row?.titular,
    row?.conductor,
    row?.chofer,
    row?.reemplazo,
    row?.nombre

  ];


  for(let value of values){

    if(!String(value || '').trim()){
      continue;
    }


    let text =
      String(value)
        .replace(
          /^\d{2,8}\s*[-–—]\s*/,
          ''
        )
        .trim();


    if(text.includes(',')){
      return text.split(',')[0].trim();
    }


    return text.split(/\s+/)[0];
  }


  return '';
}


function getDriverReference(row){

  return (
    getDriverLegajo(row)
    ||
    getDriverSurname(row)
    ||
    ''
  );
}


function uniqueDriverReferences(rows){

  return [
    ...new Set(
      (rows || [])
        .map(getDriverReference)
        .filter(Boolean)
    )
  ];
}


function compactList(values,limit=5){

  const clean =
    [
      ...new Set(
        (values || [])
          .map(
            x =>
              String(x ?? '').trim()
          )
          .filter(Boolean)
      )
    ];


  if(!clean.length){
    return '—';
  }


  const visible =
    clean.slice(0,limit);


  const more =
    clean.length -
    visible.length;


  return (
    visible.join(', ')
    +
    (
      more > 0
        ? ` +${more}`
        : ''
    )
  );
}


/* =========================================================
   ALERTAS
========================================================= */

function renderAlertCases(
  rows,
  emptyText
){

  if(!rows.length){

    return `
      <div class="alert-none">
        ${esc(emptyText)}
      </div>
    `;
  }


  const visible =
    rows.slice(0,3);


  const more =
    rows.length -
    visible.length;


  return `
    <div class="alert-card-detail">

      ${
        visible
          .map(
            r => `

              <div class="alert-detail-row">

                <span class="alert-detail-dot"></span>

                <span>

                  ${esc(
                    normalizeMechanicalCategory(
                      r.falla
                    )
                  )}

                  · Int.
                  ${esc(
                    r.interno ||
                    '-'
                  )}

                </span>

              </div>

            `
          )
          .join('')
      }


      ${
        more > 0
          ? `
            <div class="alert-additional">
              +${more}
              ${
                more === 1
                  ? 'adicional'
                  : 'adicionales'
              }
            </div>
          `
          : ''
      }

    </div>
  `;
}


function renderImpactChart(detours){

  const rows =
    countByNormalizedLine(detours)
      .slice(0,5);


  if(!rows.length){

    return `
      <div class="impact-empty">
        Sin desvíos para la jornada.
      </div>
    `;
  }


  const max =
    Math.max(
      ...rows.map(
        x =>
          Number(x.value || 0)
      ),
      1
    );


  return `
    <div class="impact-chart">

      ${
        rows.map(
          row => `

            <div class="impact-row">

              <div class="impact-line">
                ${esc(row.label)}
              </div>

              <div class="impact-track">

                <div
                  class="impact-fill"
                  style="
                    width:${
                      Math.max(
                        7,
                        Number(row.value || 0)
                        /
                        max
                        *
                        100
                      )
                    }%
                  "
                ></div>

              </div>

              <div class="impact-value">
                ${num(row.value)}
              </div>

            </div>

          `
        ).join('')
      }

    </div>
  `;
}


/* =========================================================
   RESUMEN
========================================================= */

function renderResumen(){

  const key =
    selectedDDMM('resumen');


  const plan =
    DATA.planServ || {};

  const salidas =
    DATA.salidas || {};

  const guardia =
    DATA.guardia || {};


  const units =
    sortByLineAndService(
      (salidas.unitRows || [])
        .filter(
          r =>
            sameDay(
              r.fecha,
              key
            )
        )
    );


  const replacedUnitNumbers =
    units.map(
      r =>
        r.averia
        ||
        r.interno
        ||
        ''
    );


  const planDrivers =
    (salidas.driverRows || [])
      .filter(
        r =>
          sameDay(
            r.fecha,
            key
          )
      );


  const guardDrivers =
    (guardia.driverRows || [])
      .filter(
        r =>
          sameDay(
            r.fecha,
            key
          )
      );


  const drivers =
    mergeDriverReplacements(
      planDrivers,
      guardDrivers
    );


  const driverReferences =
    uniqueDriverReferences(drivers);


  const late =
    (salidas.lateRows || [])
      .filter(
        r =>
          sameDay(
            r.fecha,
            key
          )
      );


  const lateReferences =
    uniqueDriverReferences(late);


  const mechanical =
    sortByLine(
      (guardia.incidents || [])
        .filter(
          r =>
            sameDay(
              r.fecha,
              key
            )
        )
    );

function normalizeGuardText(value){

  return normalizeText(value);
}


function splitGuardiaObservations(rows){

  const out = {
    manana:[],
    tarde:[]
  };


  (rows || [])
    .forEach(
      row => {

        const turno =
          normalizeGuardText(
            row.turno
          );


        if(turno === 'MANANA'){
          out.manana.push(row);
        }


        if(turno === 'TARDE'){
          out.tarde.push(row);
        }
      }
    );


  return out;
}


function renderGuardEvents(
  rows,
  emptyText
){

  if(!rows?.length){

    return `
      <div class="shift-empty">
        ${esc(emptyText)}
      </div>
    `;

  return rows
    .map(
      row => `
        <div class="guard-event">

          <span class="guard-event-dot"></span>

          <div>
            ${esc(row.texto)}
          </div>

        </div>
      `
    )
    .join('');
}

/* =========================================================
   KPI
========================================================= */

function fmtPct(v){

  if(
    v === null
    ||
    v === undefined
    ||
    v === ''
  ){
    return '-';
  }


  const s =
    String(v).trim();


  return s.includes('%')
    ? s
    : s + '%';
}


function rawNumber(v){

  if(
    v === null
    ||
    v === undefined
    ||
    v === ''
  ){
    return null;
  }


  const n =
    parseFloat(
      String(v)
        .replace('%','')
        .replace(',','.')
        .replace(
          /[^0-9.\-]/g,
          ''
        )
    );


  return Number.isFinite(n)
    ? n
    : null;
}


function metricProgress(value){

  const n =
    rawNumber(value);


  if(n === null){
    return 0;
  }


  return Math.max(
    0,
    Math.min(
      100,
      n
    )
  );
}


function kpiCard(metric,dateLabel){

  return `

    <article class="kpi-ref-card">

      <div class="metric-label">
        ${esc(metric.label)}
      </div>

      <div class="metric-value">
        ${esc(metric.display)}
      </div>

      <div class="metric-sub">
        Dato del día · ${esc(dateLabel)}
      </div>

      <div class="metric-track">

        <div
          class="metric-fill"
          style="
            width:${metricProgress(metric.raw)}%
          "
        ></div>

      </div>

    </article>
  `;
}


function renderKPI(){

  const d =
    DATA.kpi || {};


  const key =
    selectedDDMM('kpi');


  const r =
    (d.daily || [])
      .find(
        x =>
          sameDay(
            x.date,
            key
          )
      );


  if(!r){

    $('#kpi').innerHTML = `
      <div class="panel">
        <div class="empty">
          Sin datos KPI para el día seleccionado.
        </div>
      </div>
    `;

    return;
  }


  const metrics = [

    {
      label:'Cumplimiento plan de servicio',
      display:fmtPct(r.planCumplimiento),
      raw:r.planCumplimiento
    },

    {
      label:'Cumplimiento plan de kms',
      display:fmtPct(r.kmCumplimiento),
      raw:r.kmCumplimiento
    },

    {
      label:'Cumplimiento plan Hs Extras Conducción',
      display:fmtPct(r.hsCumplimiento),
      raw:r.hsCumplimiento
    },

    {
      label:'Titularidad',
      display:r.titularidad || '-',
      raw:r.titularidad
    },

    {
      label:'Siniestros',
      display:String(r.siniestros || 0),
      raw:r.siniestros
    },

    {
      label:'Cumplimiento Horario',
      display:r.horarioGeneral || '-',
      raw:r.horarioGeneral
    },

    {
      label:'Cumplimiento Cabecera',
      display:r.horarioCab || '-',
      raw:r.horarioCab
    },

    {
      label:'Cumplimiento Portón',
      display:r.horarioPorton || '-',
      raw:r.horarioPorton
    },

    {
      label:'IPK',
      display:String(r.ipk || '-'),
      raw:r.ipk
    },

    {
      label:'Estética',
      display:fmtPct(r.estetica),
      raw:r.estetica
    }

  ];


  $('#kpi').innerHTML = `

    <div class="section-head">

      <h2>
        KPI
      </h2>

      <div class="source">

        ${sourceLabel(
          DATA.sources?.kpi ||
          d.source
        )}

        <br>

        Día anterior ·
        ${esc(
          selectedLabel('kpi')
        )}

      </div>

    </div>


    <div class="kpi-dashboard">

      <div class="kpi-card-grid">

        ${
          metrics
            .map(
              x =>
                kpiCard(
                  x,
                  shortDateLabel(key)
                )
            )
            .join('')
        }

      </div>


      <aside class="kpi-month-panel">

        <h3>
          Metas y acumulado mensual
        </h3>

        ${
          (d.indicators || [])
            .map(
              x => `

                <div class="kpi-month-row">

                  <div>
                    ${esc(x.label)}
                  </div>

                  <div>
                    Meta ${esc(x.meta || '-')}
                  </div>

                  <div class="kpi-badge">
                    ${esc(x.accumulated || '-')}
                  </div>

                </div>

              `
            )
            .join('')
        }

      </aside>

    </div>
  `;
}


/* =========================================================
   FECHA
========================================================= */

function configureDatePicker(){

  const p =
    DATA.period || {};


  const el =
    $('#datePicker');


  if(
    !p.year
    ||
    !p.month
  ){
    return;
  }


  const today =
    todayISO();


  if(!DATE_BY_TAB.resumen){
    DATE_BY_TAB.resumen = today;
  }

  if(!DATE_BY_TAB.salidas){
    DATE_BY_TAB.salidas = today;
  }

  if(!DATE_BY_TAB.guardia){
    DATE_BY_TAB.guardia = today;
  }

  if(!DATE_BY_TAB.kpi){
    DATE_BY_TAB.kpi = kpiDefaultISO();
  }


  const hide =
    ACTIVE_TAB === 'plan'
    ||
    ACTIVE_TAB === 'os';


  el.parentElement
    .classList
    .toggle(
      'hidden',
      hide
    );


  if(hide){
    return;
  }


  el.min =
    `${p.year}-${pad2(p.month)}-01`;


  el.max =
    ACTIVE_TAB === 'kpi'
      ? kpiDefaultISO()
      : today;


  el.value =
    DATE_BY_TAB[ACTIVE_TAB];
}


/* =========================================================
   PDF
========================================================= */

function exportSummaryPDF(){

  const previousTitle =
    document.title;


  const date =
    selectedISO('resumen')
    ||
    'jornada';


  document.title =
    `TSJ_Resumen_Jornada_${date}`;


  document.body
    .classList
    .add(
      'print-summary'
    );


  window.print();


  setTimeout(
    () => {

      document.body
        .classList
        .remove(
          'print-summary'
        );

      document.title =
        previousTitle;

    },
    1500
  );
}


/* =========================================================
   RENDER
========================================================= */

function renderAll(){

  configureDatePicker();


  if(DATA.generatedAt){

    $('#updatedAt')
      .textContent =
        'Última actualización: '
        +
        new Date(
          DATA.generatedAt
        )
        .toLocaleString(
          'es-AR'
        );
  }


  renderResumen();
  renderPlan();
  renderSalidas();
  renderGuardia();
  renderOS();
  renderKPI();


  const errs =
    DATA.errors || [];


  $('#errorBox')
    .classList
    .toggle(
      'show',
      !!errs.length
    );


  $('#errorBox')
    .textContent =
      errs.length
        ? 'Algunas fuentes no pudieron leerse: '
          +
          errs.join(' · ')
        : '';
}


/* =========================================================
   CONEXION
========================================================= */

function setStatus(ok,text){

  $('#statusDot')
    .classList
    .toggle(
      'ok',
      ok
    );


  $('#statusText')
    .textContent =
      text;
}


function loadLive(force=false){

  setStatus(
    false,
    force
      ? 'Actualizando datos…'
      : 'Actualizando…'
  );


  const cb =
    'tsj_cb_'
    +
    Date.now();


  const script =
    document.createElement('script');


  window[cb] =
    payload => {

      try{

        DATA =
          payload || {};


        setStatus(
          !!payload?.ok,
          payload?.ok
            ? 'Datos en vivo'
            : 'Datos parciales'
        );


        renderAll();

      }finally{

        delete window[cb];
        script.remove();
      }
    };


  script.onerror =
    () => {

      setStatus(
        false,
        'Sin conexión'
      );


      $('#errorBox')
        .classList
        .add('show');


      $('#errorBox')
        .textContent =
          'No se pudo conectar con la fuente de datos.';


      delete window[cb];

      script.remove();
    };


  let url =
    API_URL
    +
    '?callback='
    +
    cb
    +
    '&_='
    +
    Date.now();


  if(force){
    url += '&force=1';
  }


  script.src =
    url;


  document.body
    .appendChild(script);
}


/* =========================================================
   NAVEGACION
========================================================= */

function activateTab(tabName){

  ACTIVE_TAB =
    tabName;


  document
    .querySelectorAll('.tab')
    .forEach(
      x =>
        x.classList
          .toggle(
            'active',
            x.dataset.tab === tabName
          )
    );


  document
    .querySelectorAll('.tab-panel')
    .forEach(
      x =>
        x.classList
          .toggle(
            'active',
            x.id === tabName
          )
    );


  renderAll();
}


document
  .querySelectorAll('.tab')
  .forEach(
    btn => {

      btn.addEventListener(
        'click',
        () =>
          activateTab(
            btn.dataset.tab
          )
      );

    }
  );


$('#datePicker')
  .addEventListener(
    'change',
    e => {

      if(
        [
          'resumen',
          'salidas',
          'guardia',
          'kpi'
        ]
        .includes(ACTIVE_TAB)
      ){

        DATE_BY_TAB[
          ACTIVE_TAB
        ] =
          e.target.value;
      }


      renderAll();
    }
  );


$('#refreshBtn')
  .addEventListener(
    'click',
    () =>
      loadLive(true)
  );


loadLive(false);


setInterval(
  () =>
    loadLive(false),
  300000
);

</script>
